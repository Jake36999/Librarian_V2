pipeline: ingest-folder
purpose: >-
  bring a connected folder into the library as far as the person's decisions: survey it, draft its
  cards when the commissioner approves the spend, accept the
  folders the agent policy may accept, queue the documents of the accepted reference folders, capture
  them into staging, and report the folder's reconciled ledger. Approving sources into the batch and
  starting it stay with the person (with `start_batch`, the person's own run does both; another caller's
  run holds them on the person's agenda) (implementation plan M5; as-is W-ING-01, W-FOL-04)
inputs:
  path: {type: string}
  limit: {type: integer, default: 50}
  # The commissioner's approval of the Clerk's folder drafts (two small questions per waiting card).
  # Without it, nothing is drafted and the run is as before: policy acceptance holds every undrafted
  # card, with a ticket naming the draft.
  approve_folder_drafts: {type: boolean, default: false}
  # Approve the captured sources into the batch and begin it (high risk: it commits spend). The person's
  # own run does it; another caller's run holds it on the person's agenda (no commission yet, M2).
  start_batch: {type: boolean, default: false}
steps:
  - id: survey
    action: folder_survey
    args: {path: {from: inputs.path}}
  # The Clerk describes each waiting card and checks its sensitivity, so that policy acceptance can
  # decide it (as-is W-BAT-01; implementation plan M5). Only folder metadata is sent.
  - id: draft
    action: folder_draft_pending
    args: {root: {from: inputs.path}, approve_spend: {from: inputs.approve_folder_drafts},
           limit: {from: inputs.limit}}
    when: {from: inputs.approve_folder_drafts, is: true}
    on_error: continue
  # Only under promotion.mode = agent; otherwise the person decides each folder and the run goes on
  # with whatever is already accepted.
  - id: accept
    action: folder_accept_policy
    args: {root: {from: inputs.path}}
    on_error: continue
  - id: queue
    action: folder_queue_accepted
    args: {root: {from: inputs.path}, limit: {from: inputs.limit}}
  # Only this folder's queued documents are captured; every other queued reference is left as it was
  # (the Resource-Library supervised run, 27 November: `run-queue` drained the whole shared queue).
  - id: capture
    action: intake_run
    args: {limit: {from: inputs.limit}, root: {from: inputs.path}}
  - id: begin
    action: ingestion_begin
    args: {root: {from: inputs.path}}
    when: {from: inputs.start_batch, is: true}
    on_error: continue
  - id: ledger
    action: ingestion_ledger
    args: {root: {from: inputs.path}}
outputs:
  drafted: {from: steps.draft}
  begun: {from: steps.begin}
  folders: {from: steps.ledger.folders}
  documents: {from: steps.ledger.documents}
  sources: {from: steps.ledger.sources}
  unaccounted: {from: steps.ledger.unaccounted}
  next: {from: steps.ledger.next}
