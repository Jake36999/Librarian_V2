# One behavioural model of the complete enrichment cycle. Analysis artifact, not executable process YAML.
# Existing source operations are retained; run-wide delegation, tickets and general Oracle/Doctor integration
# are target behaviour. See requirements-evidence.md and model-notes.md for that boundary.
diagram: enrichment-cycle
kind: activity
title: Proposed comprehensive ingestion and enrichment integration
target: {kind: use_case, ref: "model-notes.md"}
lens: [the-root-cause-lens, the-guard-completeness-lens, the-real-concurrency-lens]
perspective: Owner
problem:
  symptom: "Tier 0 repeatedly coordinates ingestion and resolves familiar failures while several enrichment stages and authority gates are absent from the earlier overview."
  why:
    - "The existing source lifecycle is implemented across intake, batch, staging, promotion and graph services rather than one Core-run pipeline."
    - "Review foundations exist, but general run specifications, routed fault tickets and catalogued repair are not integrated."
  root: "Complete requirements and hand-offs must be preserved when the existing operations become a delegated process."
lanes: [Owner, Tier 0 agent, Oracle, Lead (tier 1), Doctor, Clerk (tier 2), Scribe (tier 3), Core, Model host, Geo-Grapher]
nodes:
  - {id: s, kind: start}
  - {id: targetcontract, kind: note, lane: Lead (tier 1), label: "Target integration, not an execution trace. Existing stage scripts are preserved; semantic Data/metadata, tiered delegation and general Oracle/Doctor/tickets remain proposed."}
  - {id: a1, kind: activity, lane: Owner, step: 1, label: "sets or has already delegated the goal, sources, exclusions, allowed spending and required outcomes"}
  - {id: dentry, kind: decision, lane: Core, label: "who initiates this run?"}
  - {id: a2, kind: activity, lane: Tier 0 agent, step: 2, label: "hands bounded enrichment work to a Lead for its current task, including another project, and sets the run specification"}
  - {id: direct, kind: activity, lane: Owner, label: "hands the goal directly to the Lead and sets the run specification"}
  - {id: a3, kind: activity, lane: Lead (tier 1), step: 3, label: "takes responsibility for the run; requests its Core-stored specification, recorded authority and qualified role assignments"}
  - {id: callgate, kind: activity, lane: Core, label: "at every dispatch/commit checks tier, profile, grants, counters and critical flags; defers failed-route calls; scope judgement remains Oracle-owned"}
  - {id: dspecready, kind: decision, lane: Core, label: "specification schema, pinned IDs, grants and recorded independent role qualifications valid?"}
  - {id: dinput, kind: decision, lane: Core, label: "what input or continuation has been requested?"}
  - {id: maintenanceinventory, kind: activity, lane: Core, label: "inventories specified existing publications, reading receipts, source/artifact hashes, projection versions and active registrations; changes nothing"}
  - {id: maintenanceassess, kind: activity, lane: Clerk (tier 2), label: "assesses reading and projection gaps from evidence; zero concepts alone proves neither unread content nor a need to invent claims"}
  - {id: maintenanceplan, kind: activity, lane: Lead (tier 1), label: "proposes bounded affected-source reading recovery or reprojection; preserves originals, true claim strength and the actual graph rebuild radius"}
  - {id: maintenancegrant, kind: activity, lane: Core, label: "checks the proposed resource set, existing authority, accepted components, counters and current fingerprints before any maintenance write"}
  - {id: dmaintenancegrant, kind: decision, lane: Core, label: "maintenance within actual grants and registered capability?"}
  - {id: dmaintenancework, kind: decision, lane: Core, label: "Lead-requested maintenance continuation and current source state?"}
  - {id: maintenanceproject, kind: activity, lane: Core, label: "reprojects compatible completed reading under current rules with guarded writes; preserves generated/source-stated/inferred labels and verification limits"}
  - {id: dmaintenanceproject, kind: decision, lane: Core, label: "projection and fresh folder/artifact admission result?"}
  - {id: maintenancegeo, kind: activity, lane: Geo-Grapher, label: "revalidates admission and imports only the authorized paper artifact; reports the new active publication receipt without deleting generations"}
  - {id: dmaintenanceresult, kind: decision, lane: Core, label: "maintenance publication result?"}
  - {id: drevisionreturn, kind: decision, lane: Core, label: "recorded post-revision continuation?"}
  - {id: a4, kind: activity, lane: Core, step: 4, label: "scripts the folder inventory: stored purpose fields, fingerprints, credential filters, child ownership and optional Geo assignment records"}
  - {id: dstale, kind: decision, lane: Core, label: "accepted roots and reviewed group members current?"}
  - {id: a5, kind: activity, lane: Lead (tier 1), step: 5, label: "applies exclusions and proposes permitted purpose decisions without widening source access"}
  - {id: a6, kind: activity, lane: Clerk (tier 2), step: 6, label: "assesses permitted folder metadata for sensitivity using the qualified description route"}
  - {id: dfolderdraft, kind: decision, lane: Core, label: "qualified, approved folder draft available?"}
  - {id: dsensitive, kind: decision, lane: Core, label: "agent-reported sensitivity or recorded policy reserves this folder decision for a person?"}
  - {id: folderperson, kind: activity, lane: Owner, label: "reviews sensitive or otherwise reserved folder decisions"}
  - {id: dfolderperson, kind: decision, lane: Owner, label: "folder decision approved?"}
  - {id: a7, kind: activity, lane: Core, step: 7, label: "applies authorized folder decisions with current fingerprints, provenance and optional Geo group application"}
  - {id: dfolderapplied, kind: decision, lane: Core, label: "folder application succeeded?"}
  - {id: dpurpose, kind: decision, lane: Core, label: "accepted folder purpose?"}
  - {id: ownindex, kind: activity, lane: Core, label: "indexes own code, data or logs as whole content under their purpose and access rules; creates no document Sources"}
  - {id: ownverify, kind: activity, lane: Core, label: "checks requested own-content index receipts, graph IDs and original hashes; reports recorded exclusions and unchanged originals"}
  - {id: folderapprove, kind: activity, lane: Owner, label: "authorizes FolderReview.approve_batch for waiting folder metadata cards; this does not accept purposes or read documents"}
  - {id: a8, kind: activity, lane: Core, step: 8, label: "dry-counts and queues each accepted root's in-scope documents; default PDF scope and queue ledger remain explicit"}
  - {id: a9, kind: activity, lane: Core, step: 9, label: "reconciles survey, per-root queue and withheld documents using deterministic counts"}
  - {id: dcounts, kind: decision, lane: Core, label: "counts and ownership reconcile?"}
  - {id: droots, kind: decision, lane: Core, label: "accepted-root worklist and required outputs?"}
  - {id: native, kind: activity, lane: Lead (tier 1), label: "queues or captures permitted native file, URL, repository, paper, model or dataset references"}
  - {id: a10, kind: activity, lane: Core, step: 10, label: "fetches and hashes immutable evidence; stores deterministic facts, quality flags and each reference's capture result for staged proposals"}
  - {id: dcaptureguard, kind: decision, lane: Core, label: "capture raised a critical integrity or boundary flag?"}
  - {id: capturedescribe, kind: activity, lane: Clerk (tier 2), label: "owns the capture proposal: drafts neutral evidence-based description, keeps optional fit separate and returns explicit queued, refused or failed draft outcomes"}
  - {id: dcapture, kind: decision, lane: Core, label: "captured input accounting?"}
  - {id: capturefailed, kind: activity, lane: Core, label: "retains failed queue entries or quarantine evidence with the failed stage and reason"}
  - {id: accounted, kind: activity, lane: Core, label: "accounts for already-held, filtered or empty input; reports no new source rather than inventing enrichment"}
  - {id: dnowork, kind: decision, lane: Oracle, label: "does the accounted no-new-work result satisfy the specification?"}
  - {id: dsourceapprove, kind: decision, lane: Core, label: "source ingestion approval permitted for this actor?"}
  - {id: dagentingestion, kind: decision, lane: Lead (tier 1), label: "approve the staged sources for processing under the granted agent authority?"}
  - {id: approveperson, kind: activity, lane: Owner, label: "decides ingestion approval for person-mode or sensitive sources; approval still does not start processing or accept the Source"}
  - {id: dapproveperson, kind: decision, lane: Owner, label: "ingestion approval granted?"}
  - {id: a11, kind: activity, lane: Core, step: 11, label: "persists the Lead's or Owner's submitted ingestion approvals with true actor attribution; approved means queued, not read or accepted"}
  - {id: dprocessscope, kind: decision, lane: Core, label: "coverage required by this specification?"}
  - {id: a12, kind: activity, lane: Core, step: 12, label: "validates explicit authority to begin processing the approved set without repeating permission already granted for that run"}
  - {id: startperson, kind: activity, lane: Owner, label: "explicitly starts the approved batch; this is the current curate-only start boundary, retained until delegated-start support exists"}
  - {id: dstartperson, kind: decision, lane: Owner, label: "processing start approved?"}
  - {id: dstart, kind: decision, lane: Core, label: "processing start authorized and approved work available?"}
  - {id: a13, kind: activity, lane: Core, step: 13, label: "freezes the approved item set and run settings, logs the run and grants only its declared stage tools"}
  - {id: a14, kind: activity, lane: Core, step: 14, label: "before each item checks the library spend ceiling; between stages honors cancellation and the active Core writer"}
  - {id: dcontinue, kind: decision, lane: Core, label: "run may continue?"}
  - {id: stopped, kind: activity, lane: Core, label: "records cancellation, ceiling stop or interruption; retains completed receipts and pending items for explicit resumption"}
  - {id: a15, kind: activity, lane: Core, step: 15, label: "reuses only compatible source/representation/recipe/route receipts; publication still needs current artifact/projection and folder admission checks"}
  - {id: dkind, kind: decision, lane: Core, label: "approved item is source or folder metadata card?"}
  - {id: folderobserved, kind: note, lane: Clerk (tier 2), label: "Observed 22 November audit: 12 folder-item attempts in two batches failed at folder_describe; no folder_data success in that sample. The implemented chain remains metadata-only."}
  - {id: fv, kind: activity, lane: Core, label: "folder_validate: checks current inventory and review fingerprints"}
  - {id: dfv, kind: decision, lane: Core, label: "folder_validate failed?"}
  - {id: fd, kind: activity, lane: Clerk (tier 2), label: "folder_describe: drafts from bounded inventory metadata; unavailable or disabled production drafting stays queued"}
  - {id: dfd, kind: decision, lane: Core, label: "folder_describe failed?"}
  - {id: fdata, kind: activity, lane: Core, label: "folder_data: stores the inventory Data record; each stage uses the same failure and resume rules"}
  - {id: dfdata, kind: decision, lane: Core, label: "folder_data recorded outcome or critical finding?"}
  - {id: fcoverage, kind: activity, lane: Core, label: "records folder coverage as metadata only, content not examined; never credits its documents as read"}
  - {id: noteread, kind: activity, lane: Clerk (tier 2), label: "requests deep_read_note for an accepted Source; the existing reading mechanism stages a revision and leaves the accepted note unchanged"}
  - {id: drevision, kind: decision, lane: Core, label: "accepted-note reading result?"}
  - {id: revisionpartial, kind: activity, lane: Core, label: "persists partial reading receipts and checks the recorded partial-revision grant; does not create authority or credit full reading"}
  - {id: revisionapprove, kind: activity, lane: Clerk (tier 2), label: "reviews the revision against evidence and actual coverage; submits an acceptance decision within granted agent authority or a proposal for Owner review"}
  - {id: drevisionintent, kind: decision, lane: Core, label: "Clerk submitted affirmative acceptance or a reserved-review proposal?"}
  - {id: drevisionactor, kind: decision, lane: Core, label: "revision acceptance needs the Owner?"}
  - {id: revisionperson, kind: activity, lane: Owner, label: "reviews the staged Source revision and decides its acceptance"}
  - {id: drevisionperson, kind: decision, lane: Owner, label: "revision approved?"}
  - {id: revisionmerge, kind: activity, lane: Core, label: "merges only permitted revision sections into the existing Source with original snapshots and human-edit protection; creates no duplicate note"}
  - {id: drevisionmerge, kind: decision, lane: Core, label: "revision merge committed?"}
  - {id: a16, kind: activity, lane: Core, step: 16, label: "validate: checks source identity, captured evidence and unique library note name"}
  - {id: dv, kind: decision, lane: Core, label: "validate failed?"}
  - {id: a17, kind: activity, lane: Core, step: 17, label: "parse: runs scripted fetch, AST/text/PDF extraction and page mapping; preserves original text fallback; model conversion follows its agent path"}
  - {id: dp, kind: decision, lane: Core, label: "scripted parse result or recorded model-conversion request?"}
  - {id: conversionplan, kind: activity, lane: Clerk (tier 2), label: "plans bounded model transcription or cleanup from extraction gaps; retains originals, page scope and permitted conversion limits"}
  - {id: conversionwork, kind: activity, lane: Scribe (tier 3), label: "performs assigned model transcription or text cleanup through the configured adapter; returns page-linked text and explicit gaps"}
  - {id: conversionreview, kind: activity, lane: Clerk (tier 2), label: "proofreads model conversion against source evidence; judges fidelity and retains unreadable or uncertain pages as gaps"}
  - {id: conversioncheck, kind: activity, lane: Core, label: "checks returned schemas, hashes and literal page locators; stores the Clerk's review verdict and actual conversion receipts"}
  - {id: dconversion, kind: decision, lane: Core, label: "recorded conversion result and mechanical checks?"}
  - {id: conversiongap, kind: activity, lane: Core, label: "retains returned cleanup-error partial or missing-material partial/queued status and usable raw extraction; missing content receives no reading credit"}
  - {id: conversionfallback, kind: activity, lane: Core, label: "keeps unmapped cleanup unused; restores original page-mapped text; parse may complete only with usable text and no other remaining gap"}
  - {id: conversionoutage, kind: activity, lane: Core, label: "records transport code, attempts, retry-after and known/unknown cost; defers equivalent calls on the failed route pending bounded direction"}
  - {id: conversionroute, kind: decision, lane: Lead (tier 1), label: "retry affected conversion within the grant, retain fallback, or pause the affected work?"}
  - {id: dconversionretry, kind: decision, lane: Core, label: "same-route retry within counters, backoff, current qualification and existing authority?"}
  - {id: a18, kind: activity, lane: Clerk (tier 2), step: 18, label: "read: directs bounded part-reading tasks and proofreads their evidence without introducing the project's fit judgement"}
  - {id: a19, kind: activity, lane: Scribe (tier 3), step: 19, label: "completes assigned small reading tasks: located points, limits, terms and grounded lens candidates"}
  - {id: a20, kind: activity, lane: Model host, step: 20, label: "answers qualified bounded tasks through the configured adapters; unavailable or refused routes retain visible task outcomes"}
  - {id: a21, kind: activity, lane: Core, step: 21, label: "checks schemas, hashes, literal quote locators and task counters; persists agent-submitted reading and lens results; queued tasks never count as read"}
  - {id: dr, kind: decision, lane: Core, label: "read failed?"}
  - {id: readoutage, kind: activity, lane: Core, label: "records 429/timeout/unavailable route and bounded attempts; defers equivalent failed-route calls; retains task gaps, receipts and unpriced cost"}
  - {id: readroute, kind: decision, lane: Lead (tier 1), label: "retry only pending affected tasks within the grant, keep queued gaps, or pause?"}
  - {id: dreadretry, kind: decision, lane: Core, label: "same-route pending-task retry within counters, backoff, qualification and existing authority?"}
  - {id: a22, kind: activity, lane: Core, step: 22, label: "lenses: persists agent-selected candidates, challenges, citations and discard records from reading; each proposal stays separately staged"}
  - {id: dl, kind: decision, lane: Core, label: "lenses stage failed?"}
  - {id: a23, kind: activity, lane: Clerk (tier 2), step: 23, label: "data: owns kind-specific component or chapter organization from evidence and scripted inventories; proposes records with actual coverage and explicit inapplicability"}
  - {id: dd, kind: decision, lane: Core, label: "data stage failed?"}
  - {id: a24, kind: activity, lane: Clerk (tier 2), step: 24, label: "relate: synthesizes document chapter relations from fully read material; retains queued or partial outcomes and existing static relations"}
  - {id: drel, kind: decision, lane: Core, label: "relate stage failed?"}
  - {id: a25, kind: activity, lane: Clerk (tier 2), step: 25, label: "metadata: proposes evidence-based content-model fields, retains Unknown where appropriate and leaves confirmation to acceptance"}
  - {id: dmeta, kind: decision, lane: Core, label: "metadata stage failed?"}
  - {id: a26, kind: activity, lane: Clerk (tier 2), step: 26, label: "review: owns the source package and Bottom Line; reconciles reading, Data, relations and metadata against evidence; distinguishes low confidence, no answer and refusal"}
  - {id: dreview, kind: decision, lane: Core, label: "review stage failed?"}
  - {id: a27, kind: activity, lane: Core, step: 27, label: "publish: checks reading/conversion, artifact binding and projection compatibility; freshly checks enabled, accepted, current, trusted folder assignment"}
  - {id: dpubkind, kind: decision, lane: Core, label: "paper publication applicability?"}
  - {id: a28, kind: activity, lane: Geo-Grapher, step: 28, label: "revalidates folder/artifact admission and publishes eligible reading claims; returns actual result or late refusal; Source acceptance remains separate"}
  - {id: pubna, kind: activity, lane: Core, label: "records publish as not applicable for a non-PDF or non-full-conversion artifact, with the conversion limitation retained"}
  - {id: pubpartial, kind: activity, lane: Core, label: "preserves reading and exact publish gap: incomplete reading, FOLDER_STALE, awaiting_accepted_folder, disabled Geo, stale artifact or returned/caught failure"}
  - {id: dpubresult, kind: decision, lane: Core, label: "eligible publication succeeded?"}
  - {id: a29, kind: activity, lane: Core, step: 29, label: "records stage outcomes and keys; source changes make results stale; failed stops this item, other incomplete statuses remain partial"}
  - {id: dstatus, kind: decision, lane: Core, label: "item result?"}
  - {id: itemfailed, kind: activity, lane: Core, label: "records the failed item's stage, evidence and reported fault flags; other frozen items continue only after critical-flag routing"}
  - {id: ditemcritical, kind: decision, lane: Core, label: "existing scripted violation code or agent finding carries a critical flag?"}
  - {id: partial, kind: activity, lane: Core, label: "retains exact partial coverage and stage reasons, including publication gaps; never relabels the item enriched"}
  - {id: partialticket, kind: activity, lane: Core, label: "records a repair-required partial item's ticket without blocking other frozen items; required repair remains a final-verdict obligation"}
  - {id: dpartial, kind: decision, lane: Lead (tier 1), label: "does the specification permit retaining these declared gaps?"}
  - {id: a30, kind: activity, lane: Core, step: 30, label: "accounts for the item and continues the frozen set; failures never undo another item's finished work"}
  - {id: dmore, kind: decision, lane: Core, label: "more frozen items?"}
  - {id: a31, kind: activity, lane: Core, step: 31, label: "exposes separate Source, folder and lens decision worklists with current states and owners; retains failed-item tickets and historical enqueue attribution"}
  - {id: dreadyitems, kind: decision, lane: Core, label: "any unaccounted in-scope Source/folder/lens decisions in actually decidable states?"}
  - {id: dacceptkind, kind: decision, lane: Core, label: "recorded decision item is Source, folder card or independent lens?"}
  - {id: dlensauthor, kind: decision, lane: Core, label: "existing mode, sensitivity and declared actor permit an independent agent lens decision?"}
  - {id: lensreview, kind: activity, lane: Clerk (tier 2), label: "makes a separately authorized accept/reject/defer decision for the staged reasoning instruction and its passage; Source acceptance confers none"}
  - {id: lensperson, kind: activity, lane: Owner, label: "decides accept/reject/defer for a person-mode, sensitive or otherwise reserved lens; agent permission alone cannot decide it"}
  - {id: lensrecord, kind: activity, lane: Core, label: "applies the recorded lens decision through existing gated staging; keeps passage immutable and decision actor explicit; no Source promotion"}
  - {id: dlensrecord, kind: decision, lane: Core, label: "lens decision recorded, blocked or critical?"}
  - {id: folderaccept, kind: activity, lane: Owner, label: "reviews the enriched folder card's purpose, authorship, sensitivity, description, graph and fresh fingerprint in Folders review"}
  - {id: dfolderaccept, kind: decision, lane: Owner, label: "folder-card decision approved?"}
  - {id: folderapply, kind: activity, lane: Core, label: "applies the folder decision through FolderReview, with its barriers and provenance; does not promote a Source note"}
  - {id: dfoldernext, kind: decision, lane: Core, label: "folder decision succeeded and requires document ingestion?"}
  - {id: a32, kind: activity, lane: Core, step: 32, label: "previews acceptance mechanically: recorded sensitivity/mode, agent review status, required-field schemas, coverage/attempt counters, leases and fingerprints"}
  - {id: dacceptready, kind: decision, lane: Core, label: "acceptance schemas, recorded agent review and state guards ready?"}
  - {id: acceptprose, kind: activity, lane: Clerk (tier 2), label: "supplies or revises grounded prose and metadata proposals; low-confidence drafts are not silently accepted as reviewed-ok"}
  - {id: dprosebound, kind: decision, lane: Clerk (tier 2), label: "did the draft make meaningful progress within the Core-reported correction allowance?"}
  - {id: dauthor, kind: decision, lane: Core, label: "who may accept this item under policy?"}
  - {id: acceptperson, kind: activity, lane: Owner, label: "reviews sensitive items, person-mode promotion and interrupted promotion; decides whether to accept"}
  - {id: dpersonaccept, kind: decision, lane: Owner, label: "acceptance approved?"}
  - {id: a33, kind: activity, lane: Clerk (tier 2), step: 33, label: "submits the acceptance packet: makes the granted agent decision or carries the Owner's recorded decision; retains true actor, per-item origin and actual coverage"}
  - {id: dacceptintent, kind: decision, lane: Core, label: "recorded agent or Owner acceptance affirmative?"}
  - {id: a34, kind: activity, lane: Core, step: 34, label: "writes through the Core writer with leases and compare-and-swap checks; retains originals and records interrupted promotion visibly"}
  - {id: dwrite, kind: decision, lane: Core, label: "promotion committed?"}
  - {id: a35, kind: activity, lane: Core, step: 35, label: "checks write receipts, concepts, backlinks, topic and Master indexes, applicable vectors, provenance and title/Bottom Line/concept findability"}
  - {id: dfind, kind: decision, lane: Core, label: "required note checks pass?"}
  - {id: dacceptmore, kind: decision, lane: Core, label: "more unaccounted in-scope decisions? Deferred obligations stay visible for the final verdict"}
  - {id: a36, kind: activity, lane: Oracle, step: 36, label: "judges outputs against the Core-stored specification and actual coverage: consumes scripted checks, then applies isolated model judgement"}
  - {id: doracle, kind: decision, lane: Oracle, label: "run verdict?"}
  - {id: a37, kind: activity, lane: Lead (tier 1), step: 37, label: "returns verdict, coverage, publication, tickets, known/unknown spending and authority exceptions; names separate owners for any remaining Source/lens decisions"}
  - {id: drecipient, kind: decision, lane: Core, label: "specification owner?"}
  - {id: a38, kind: activity, lane: Tier 0 agent, step: 38, label: "reviews the handback against its delegated goal for the current external task; does not repeat the workers' tasks"}
  - {id: doverseer, kind: decision, lane: Tier 0 agent, label: "handback ready for the active task or Owner?"}
  - {id: overseerreport, kind: activity, lane: Tier 0 agent, label: "returns the result to its active external task and reports to the Owner as directed"}
  - {id: tidy, kind: activity, lane: Tier 0 agent, label: "requests bounded correction and independent recheck; workers repair and the Oracle judges"}
  - {id: dtidybound, kind: decision, lane: Core, label: "within the accepted single tidy-up and final-pass allowance?"}
  - {id: directreport, kind: activity, lane: Owner, label: "receives the Lead's result and Oracle verdict directly"}
  - {id: mreport, kind: activity, lane: Core, label: "records delivery of the result to its specification owner"}
  - {id: e1, kind: end, outcome: success, label: "required Source artifacts are accepted with true coverage; specified lens decisions, findability, folder access and applicable graph obligations are met"}
  - {id: partialreport, kind: activity, lane: Lead (tier 1), label: "returns permitted partial coverage and verdict with gaps, tickets, known/unknown spend and separate Source/lens decision states and owners"}
  - {id: epartial, kind: end, outcome: partial, label: "a partial result is reported with its actual coverage and unresolved obligations"}
  - {id: enowork, kind: end, outcome: reused, label: "no new enrichment: existing, filtered, excluded or empty inputs are accounted for"}
  - {id: ticket, kind: activity, lane: Core, label: "persists submitted fault tickets: run, use case, extension, existing refusal/flags, evidence, declared responsible actor and rejoin"}
  - {id: dticket, kind: decision, lane: Core, label: "which recorded flag and existing responsibility route applies?"}
  - {id: critical, kind: activity, lane: Owner, label: "receives critical security, data-loss, attestation or authority-boundary evidence immediately, with tier 0 when present"}
  - {id: decisionowner, kind: activity, lane: Owner, label: "decides reserved spending, sensitivity, promotion or proposed compensation; the ticket waits for that decision"}
  - {id: downer, kind: decision, lane: Owner, label: "reserved decision permits continuation?"}
  - {id: compensation, kind: activity, lane: Owner, label: "carries out the specifically chosen compensation; preserves its receipt and unresolved original symptom for Lead diagnosis"}
  - {id: decisionrecord, kind: activity, lane: Core, label: "records the completed reserved decision and any explicit revised authority before re-admitting the affected operation"}
  - {id: scopejudge, kind: activity, lane: Oracle, label: "judges the outside-envelope request against the run specification; cannot expand its mandate or include reserved or always-ask decisions"}
  - {id: dscope, kind: decision, lane: Core, label: "recorded Oracle verdict and existing grant/always-ask checks?"}
  - {id: scoperecord, kind: activity, lane: Core, label: "records the evidence-bearing permitted allowance for final reporting; re-admits only the original affected operation"}
  - {id: doctor, kind: activity, lane: Doctor, label: "diagnoses the mapped failure and judges catalogued remedy fit and actual affected scope; proposes the remedy under its isolated revisable role assignment"}
  - {id: dremedy, kind: decision, lane: Core, label: "accepted remedy ID and declared resource set within recorded grants and attempt counters?"}
  - {id: repair, kind: activity, lane: Doctor, label: "executes the permitted remedy through registered actions; records attempts and proposed compensation without automatic rollback"}
  - {id: recheck, kind: activity, lane: Oracle, label: "independently rechecks the repaired symptom and affected requirements against evidence; the Doctor never declares closure"}
  - {id: drecheck, kind: decision, lane: Oracle, label: "repair verified?"}
  - {id: close, kind: activity, lane: Core, label: "records the verified ticket resolution, remedy history and exact authorized rejoin; new remedies still require Owner acceptance"}
  - {id: drejoin, kind: decision, lane: Core, label: "ticket's recorded authorized rejoin?"}
  - {id: scout, kind: activity, lane: Clerk (tier 2), label: "investigates an unmapped failure or misalignment read-only, directing bounded Scribe tasks where useful"}
  - {id: realign, kind: activity, lane: Lead (tier 1), label: "owns the unmapped diagnosis and re-alignment; proposes a new remedy or escalates without widening the specification"}
  - {id: drealign, kind: decision, lane: Lead (tier 1), label: "a permitted correction is available?"}
  - {id: realigncheck, kind: activity, lane: Oracle, label: "independently checks the Lead's correction; a failed or uncertain recheck is escalated with retained evidence"}
  - {id: drealigncheck, kind: decision, lane: Oracle, label: "Lead correction verified?"}
  - {id: escalation, kind: activity, lane: Lead (tier 1), label: "explains the unresolved diagnosis and required intervention to tier 0 or the Owner; submits the evidence-bearing ticket through Core storage/dispatch"}
  - {id: paused, kind: activity, lane: Lead (tier 1), label: "explains held work, the required decision and the permitted resume point to the specification owner using persisted receipts"}
  - {id: epaused, kind: end, outcome: paused, label: "paused or interrupted with retained evidence and an explicit decision or resume requirement"}
  - {id: eescalated, kind: end, outcome: escalated, label: "an unresolved or critical ticket is handed to its accountable tier 0 agent or Owner"}
edges:
  - {from: s, to: targetcontract}
  - {from: targetcontract, to: a1}
  - {from: a1, to: dentry}
  - {from: dentry, to: a2, guard: "tier 0 delegates"}
