# Proposed report model with equivalent local report exits; no runtime implementation.
diagram: proposed-ingestion
kind: activity
title: 'Proposed to-be ingestion: accountable mixed processing and separate decisions'
target:
  kind: use_case
  ref: proposed-ingestion.md#use-case-description
lens:
- the-root-cause-lens
- the-guard-completeness-lens
- the-real-concurrency-lens
perspective: Owner
problem:
  symptom: The corrected current parent needs delegated direction, trustworthy group receipts and complete mixed-item
    decision accounting.
  why:
  - Approval, processing start, per-item enrichment and later acceptance were compressed into one apparent operation.
  - Semantic decisions were assigned to scripts, and Oracle review was confused with coordinating repairs.
  root: Lead owns the commissioned parent; kind-specific children return evidence to the original ledger and independent
    review precedes the final handback.
lanes:
- Owner
- Tier 0 agent
- Oracle
- Lead (tier 1)
- Doctor
- Clerk (tier 2)
- Scribe (tier 3)
- Core
- Model host
- Geo-Grapher
nodes:
- id: ownerreport
  kind: activity
  lane: Owner
  label: receives the Lead result and Oracle verdict directly, without an absent tier-0 intermediary
- id: delivery
  kind: activity
  lane: Core
  label: records the parent result delivered to its actual specification owner; retains outstanding decisions and
    limitations
- id: s
  kind: start
- id: a1
