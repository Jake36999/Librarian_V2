perspective: Owner
problem:
  symptom: "The research session found no papers to keep, though all 96 had been read."
  why:
    - "The papers existed only as staged items, catalogue cards and the paper graph."
    - "Nobody accepted the enriched items out of staging."
    - "Nothing told anyone the acceptance was still owed."
  root: "The ingestion has no step that owns the last hand-off, and no signal when it is missing (OP1)."
