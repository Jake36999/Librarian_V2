# Corrected folder-application scope and observed/current/target boundary, 23 November 2026.
diagram: ingest-papers-tier0
status: IMPLEMENTED_OBSERVED
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/as-is/ingestion.spec.yaml
kind: activity
title: 'DataManagement ingestion: observed path and current-code alternatives'
target:
  kind: use_case
  ref: ../../USE-CASES.md#uc1-make-a-folder-of-papers-into-library-knowledge-as-is
lens:
- the-root-cause-lens
- the-guard-completeness-lens
- the-real-concurrency-lens
perspective: Owner
problem:
  symptom: On 19 November the research session found no accepted papers to keep, although processing had produced
    staged readings and graph artifacts.
  why:
  - Enrichment and Source acceptance were separate operations.
  - The final acceptance handoff was unowned and invisible in that run.
  root: 'Historical OP1: no accountable final acceptance handoff; later backlog visibility fixes must not rewrite
    this run.'
lanes:
- Owner
- Tier 0 agent
- Core
- Model worker (legacy transport)
- Model host
- Geo-Grapher
nodes:
- id: s
  kind: start
- id: a1
  kind: activity
  lane: Owner
  label: directs E:\DataManagement ingestion into Resource-Library with pre-read exclusions; later partial acceptance
    remains an explicit decision
  step: 1
- id: a2
  kind: activity
  lane: Tier 0 agent
  label: attaches the folder on the Owner's behalf
  step: 2
- id: a3
  kind: activity
  lane: Core
  label: inventories roots, fingerprints and literal folder facts; excludes hidden and scratch content before reading
  step: 3
- id: d1
  kind: decision
  lane: Core
  label: reviewed roots current?
- id: x1
  kind: activity
  lane: Tier 0 agent
  label: requests the stale root survey and authorized decision reapplication; preserves the actual library-wide
    affected scope
- id: a4
  kind: activity
  lane: Owner
  label: 'decides purpose and exclusions: 11, 12, 13 and _external remain unread'
  step: 4
- id: a5
  kind: activity
  lane: Tier 0 agent
  label: submits the Owner's folder decisions with their actual authority and reason
  step: 5
- id: d2
  kind: decision
  lane: Core
  label: assigned folder-review Clerk qualified in this Core?
- id: x2
  kind: activity
  lane: Tier 0 agent
  label: restores qualification after the recorded shared-store defect, then requests a fresh qualification check
- id: draftfault
  kind: activity
  lane: Tier 0 agent
  label: diagnoses the actual post-draft transport, schema, provenance or missing-output failure from recorded evidence;
    retains existing flags and reports the unresolved scope without assuming qualification loss
- id: a6
  kind: activity
  lane: Model worker (legacy transport)
  label: drafts folder descriptions and sensitivity findings through the historical legacy model transport
  step: 6
- id: d3
  kind: decision
  lane: Model worker (legacy transport)
  label: model-reported sensitivity or reserved folder decision?
- id: x3
  kind: decision
  lane: Owner
  label: Owner's decision for the held folder?
- id: exclude
  kind: activity
  lane: Core
  label: records exclusion and removes that subtree from the eligible worklist without reading it
- id: a7
  kind: activity
  lane: Core
  label: submits affirmative folder decisions and read barriers for group application; acceptance is recorded only
    after the CLI succeeds
  step: 7
- id: dfolder
  kind: decision
  lane: Core
  label: folder application result?
- id: folderfault
  kind: activity
  lane: Tier 0 agent
  label: retains GEOGRAPHER_CALL_FAILED or other folder refusal; investigates actual capability/scope before authorized
    retry
- id: dinput
  kind: decision
  lane: Core
  label: requested Source-eligible subset remains after common folder-group application?
- id: a8
  kind: activity
  lane: Tier 0 agent
  label: requests Source queueing per deepest accepted root for third-party, research-docs and own-docs content
  step: 8
- id: d4
  kind: decision
  lane: Core
  label: scripted current-item count reconciles with eligible inventory?
- id: queuefix
  kind: activity
  lane: Tier 0 agent
  label: investigates unexplained mismatch; requests per-root queueing without treating historical queued ledger
    entries as current pending work
- id: a9
  kind: activity
  lane: Core
  label: captures immutable source evidence and records each reference result; retains exclusions, duplicates and
    isolated parser/quarantine failures
  step: 9
- id: dcapture
  kind: decision
  lane: Core
  label: usable captured Sources remain?
- id: capturefault
  kind: activity
  lane: Tier 0 agent
  label: retains failed references and successful siblings separately; reports required capture gaps for a bounded
    decision
- id: capturedescribe
  kind: activity
  lane: Model worker (legacy transport)
  label: writes neutral descriptions from captured evidence through the legacy model transport
  step: 10
- id: capturestore
  kind: activity
  lane: Core
  label: stages Source evidence and records mixed-batch item identities; folder cards remain distinct from Source
    content
  step: 11
- id: a10
  kind: activity
  lane: Tier 0 agent
  label: submits the Owner-authorized ingestion approvals with executor, decision authority and recorded attestation
    distinguished
  step: 12
- id: startrequest
  kind: activity
  lane: Tier 0 agent
  label: requests an explicit processing start through the existing curate/person authority; approval alone only
    queues
  step: 13
- id: dstartauthority
  kind: decision
  lane: Core
  label: current explicit processing-start authority present?
- id: startowner
  kind: decision
  lane: Owner
  label: grant processing start for the approved set?
- id: startrun
  kind: activity
  lane: Core
  label: validates the existing curate/person start permission and freezes the approved selection; returns the active
    run instead of duplicating it
  step: 14
- id: enrich
  kind: ref
  lane: Core
  label: 'dispatches the approved mixed batch: Sources use nine stages; folder metadata uses its separate three-stage
    chain'
  step: 15
  use_case: batch-enrichment-current
- id: a14
  kind: note
  lane: Tier 0 agent
  label: observes progress/spend; Core checks ceiling before each item and cancellation between stages. Task-pool
    concurrency is internal to the child, not document-level parallelism
- id: d5
  kind: decision
  lane: Core
  label: returned coverage and obligations permit acceptance?
- id: x5
  kind: activity
  lane: Tier 0 agent
  label: obtains a new authorized approval/start for finished partial work; unfinished frozen-run resume remains
    distinct
- id: d6
  kind: decision
  lane: Tier 0 agent
  label: Source decision owner acts on the returned package?
- id: a15
  kind: activity
  lane: Tier 0 agent
  label: accepts 96 Sources under the Owner's direction, retaining 93 fully read/published items and three accepted
    partials with publication gaps
  step: 16
- id: sourceledger
  kind: activity
  lane: Core
  label: persists the actual Source decision; hands independent lens proposals to their own decision owner with
    accept/reject/defer still separate
- id: a16
  kind: activity
  lane: Core
  label: applies the guarded Source writer and retains the actual commit/refusal/attempt state; Source acceptance
    does not accept lenses
  step: 17
- id: d7
  kind: decision
  lane: Core
  label: required retrieval checks pass for the written notes?
- id: a17
  kind: activity
  lane: Tier 0 agent
  label: reconciles current Source states, coverage, publication receipts, labels and separate lens decisions; reports
    the dated cohort truth to the Owner
  step: 18
- id: pausedreport
  kind: activity
  lane: Tier 0 agent
  label: reports distinct cancellation, interruption, ceiling stop or pending decision, completed siblings and exact
    continuation point to the Owner
- id: escalatereport
  kind: activity
  lane: Tier 0 agent
  label: reports unresolved processing/capture/integrity faults with originating stage, existing flags and retained
    evidence
- id: reuseledger
  kind: activity
  lane: Core
  label: reconciles no-new-work or already-current results with the parent ledger; does not count enqueue history
    as outstanding work
- id: e1
  kind: end
  label: 96 accepted Source notes; 93 fully read/published; three explicitly accepted partials retain publication
    gaps
  outcome: success
- id: e2
  kind: end
  label: '19 November: processing retained in staging while Source acceptance was unowned (historical OP1)'
  outcome: paused
- id: e3
  kind: end
  label: Source note remains written; required retrieval failed and the actual miss is retained
  outcome: failure
- id: e4
  kind: end
  label: paused with a named decision owner, retained work and the actual stop reason
  outcome: paused
- id: escalated
  kind: end
  label: unresolved fault reported to the Owner without discarding completed work
  outcome: escalated
- id: reused
  kind: end
  label: existing or excluded work accounted for; no duplicate Source processing claimed
  outcome: reused
- id: nonsource
  kind: end
  outcome: reused
  label: returns the common folder-application receipt; no Source intake applies on this branch and parser completeness
    is not attested
- id: draftcheck
  kind: activity
  lane: Core
  label: validates the returned draft status, required fields and literal provenance; records provider, schema and
    missing-evidence flags without judging semantic adequacy
- id: ddraft
  kind: decision
  lane: Core
  label: returned folder draft structurally valid with the Clerk's explicit sensitivity finding?
- id: dwrite
  kind: decision
  lane: Core
  label: guarded Source write result and current commit state?
- id: findcheck
  kind: activity
  lane: Core
  label: checks required title, Bottom-Line and concept retrieval only for a confirmed committed Source note; records
    actual searches
- id: writestate
  kind: activity
  lane: Core
  label: reconciles the attempt, lease, current note/hash and commit evidence read-only; preserves human edits and
    records the reserved write checkpoint without assuming a commit
- id: writeowner
  kind: decision
  lane: Owner
  label: Owner's bounded decision for the held or unconfirmed Source write?
- id: applygroups
  kind: activity
  lane: Geo-Grapher
  label: applies all accepted non-excluded groups, including documents and papers; ingests supported code/text and
    may reuse matching complete snapshots
- id: applicationreceipt
  kind: activity
  lane: Core
  label: checks CLI exit, JSON and pinned version; records successful application and accepted decisions; returned
    JSON does not attest parser completeness
- id: scopeNote
  kind: note
  lane: Tier 0 agent
  label: Historical default follows the partial cohort. Other branches are current-code alternatives; red arrows
    mean alternatives, not failure. Unexercised paths are not claimed as events.
- id: x1application
  kind: activity
  lane: Tier 0 agent
  label: requests application-stage stale-root resurvey and authorized reapplication; retains actual library-wide
    scope
