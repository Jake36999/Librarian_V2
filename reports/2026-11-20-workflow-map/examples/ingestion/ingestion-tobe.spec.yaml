  - {id: r6,  kind: ref,      lane: Doctor, use_case: UC-D,    label: "applies the catalogued remedy for the shortfall"}
  - {id: x8,  kind: activity, lane: Helper (tier 2),           label: "scouts the shortfall's blast radius, read-only"}
  - {id: x9,  kind: activity, lane: Lead (tier 1),             label: "re-aligns the run with the specification, from the oracle's report and the scouting"}
