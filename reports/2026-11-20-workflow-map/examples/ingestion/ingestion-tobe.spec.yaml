  - {id: xp,  kind: activity, lane: Tier 0 agent,              label: "reports the paused run to the Owner, with the decision it needs"}
  - {id: e1,  kind: end, outcome: success,   label: "the Owner has the result and its report: Source notes findable, labelled, in the graph"}
