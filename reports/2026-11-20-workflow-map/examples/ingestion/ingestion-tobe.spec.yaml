# To-be: the ingestion run by the tiers, overseen by tier 0 on the Owner's behalf (owner direction, 2026-11-20).
# Lanes in the owner's order: Owner, tier 0, Oracle, tier 1, Doctor, tier 2, tier 3; then the system actors.
# - Tier 0 initiates (hands the run to a Lead and sets the oracle's spec), reviews once, and reports to the Owner.
#   If the review is not satisfied it tasks the oracle with tidying up, waits for the oracle's response, makes
#   one more pass, and reports. Counted in tier-0 turns: 2 is ideal, 3 expected, 4 rusty, 5-10 bad.
# - The Owner's steps between start and report are decisions only the Owner can make, relayed by tier 0.
# - The oracle judges and never acts; the doctor repairs failures at mapped extension points (UC-D); a shortfall
#   no extension maps is a tier-1 misalignment, re-aligned by the Lead from the oracle's report.
diagram: ingest-papers-tobe
kind: activity
title: Ingest a folder of papers, overseen by tier 0 for the Owner (to-be)
target: {kind: use_case, ref: "../../USE-CASES.md#uc1-make-a-folder-of-papers-into-library-knowledge-as-is"}
lens: [the-root-cause-lens, the-guard-completeness-lens, the-real-concurrency-lens]
perspective: Owner
problem:
  symptom: "In the as-is run control came back to tier 0 six times on the happy path (graded bad), and every failure was resolved by tier 0 by hand."
  why:
    - "The ingestion ran as API calls from outside the Core, not as a workflow inside it."
    - "No tier-1 or tier-2 agent had a step, so tier 0 did their work at tier-0 cost."
    - "Nothing judged the run against its success guarantee except tier 0 itself."
  root: "The ingestion is not a workflow the Core runs; failures have no owner below tier 0; completion has no judge apart from the worker."
lanes: [Owner, Tier 0 agent, Oracle, Lead (tier 1), Doctor, Helper (tier 2), Clerk (tier 3), Core, Model host, Geo-Grapher]
nodes:
