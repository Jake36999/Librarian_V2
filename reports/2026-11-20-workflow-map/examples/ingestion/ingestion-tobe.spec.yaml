  - {id: x10, kind: activity, lane: Tier 0 agent,              label: "tasks the oracle with tidy-up instructions"}
  - {id: x11, kind: activity, lane: Oracle,                    label: "oversees the tidy-up, through the Lead and the doctor"}
  - {id: x12, kind: activity, lane: Lead (tier 1),             label: "applies the oracle's instructions"}
  - {id: x13, kind: activity, lane: Oracle,                    label: "judges again and submits its response to tier 0"}
  - {id: x14, kind: activity, lane: Tier 0 agent,              label: "makes a second, final pass"}
  - {id: a21, kind: activity, lane: Tier 0 agent,    step: 21, label: "reports the result to the Owner"}
