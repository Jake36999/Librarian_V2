# Proposed behaviour for review, not an executable process definition or implemented Core capability.
# Ingestion supplies authorized captured source work. Acceptance/promotion remains the parent's next gate.
diagram: proposed-tobe-enrichment
kind: activity
title: Proposed to-be enrichment
target: {kind: use_case, ref: "PROPOSAL.md#use-case-description"}
lens: [the-root-cause-lens, the-guard-completeness-lens, the-real-concurrency-lens]
perspective: Owner
problem:
  symptom: "Enrichment needs repeated coordination from tier 0, and completed part reading does not by itself account for every required derived output."
  why:
    - "Source stages and bounded task pools exist, but their orchestration, ownership and repair are not integrated into one delegated run."
    - "Required whole-source derivations can remain queued after every part is counted as read."
  root: "The run needs one accountable Lead, separate completion evidence for reading and derivations, and independent judgement with bounded repair."
lanes: [Owner, Tier 0 agent, Oracle, Lead (tier 1), Doctor, Clerk (tier 2), Scribe (tier 3), Core, Model host, Geo-Grapher]
nodes:
  - {id: s, kind: start}
  - {id: a1, kind: activity, lane: Owner, step: 1, label: "sets or has already authorized the enrichment goal, captured sources, required outputs, coverage and spending"}
  - {id: dentry, kind: decision, lane: Core, label: "recorded parent invocation or standalone commissioner?"}
  - {id: parentbind, kind: activity, lane: Core, label: "binds the child to its invoking parent's authorized specification, Lead, source subset and receipt keys; no repeated Owner or tier-0 commissioning"}
  - {id: a2, kind: activity, lane: Tier 0 agent, step: 2, label: "delegates the bounded enrichment to a Lead and sets its specification, including when supporting another project"}
  - {id: direct, kind: activity, lane: Owner, label: "commissions the Lead directly and owns the run specification"}
  - {id: a3, kind: activity, lane: Lead (tier 1), step: 3, label: "owns completion and plans the run from accepted components without widening the parent's mandate"}
  - {id: a4, kind: activity, lane: Core, step: 4, label: "checks specification schema, pinned IDs, recorded start authority, role qualifications, grants and counters; preserves the parent's batch ledger"}
  - {id: dadmit, kind: decision, lane: Core, label: "run admitted?"}
  - {id: ownerstart, kind: activity, lane: Owner, label: "decides the missing start, sensitivity or spending authority; existing authority is not asked for again"}
  - {id: downerstart, kind: decision, lane: Owner, label: "authorized?"}
  - {id: radmit, kind: ref, lane: Doctor, use_case: UC-D, label: "resolves a mapped qualification or admission fault using an accepted remedy within scope"}
  - {id: nowork, kind: activity, lane: Lead (tier 1), label: "returns no-source-work to the invoking parent or standalone commissioner; preserves the parent's pending decisions and original item accounting"}
  - {id: stagecontract, kind: note, lane: Core, label: "Target integration: Core checks grants, counters and critical flags at every dispatch/commit. Agents own meaning. Deferred routes return queued tasks; no silent model substitution."}
  - {id: a5, kind: activity, lane: Core, step: 5, label: "validate: checks source hashes, evidence, paths and compatible recipe/route receipts; applies stops and spend controls; old publication never bypasses fresh admission"}
  - {id: dvalidate, kind: decision, lane: Core, label: "source validation result?"}
  - {id: a6, kind: activity, lane: Core, step: 6, label: "parse: runs scripted AST, text or PDF extraction and page mapping; retains original evidence and records extraction limits"}
  - {id: dparse, kind: decision, lane: Core, label: "scripted extraction result?"}
  - {id: conversionplan, kind: activity, lane: Clerk (tier 2), label: "assigns needed model-assisted transcription or cleanup to a Scribe within the approved route and allowance"}
  - {id: conversionwork, kind: activity, lane: Scribe (tier 3), label: "transcribes or cleans the supplied material, preserves page or part anchors and explains any uncertain or missing content"}
  - {id: conversionreview, kind: activity, lane: Clerk (tier 2), label: "checks available conversion against original evidence for fidelity; records uncertainty and missing material; does not attest unread pages"}
  - {id: conversioncheck, kind: activity, lane: Core, label: "checks returned fields, hashes and literal anchors; stores task outcomes and the Clerk's fidelity verdict with actual representation coverage"}
  - {id: dconversion, kind: decision, lane: Core, label: "conversion task and anchor-check status?"}
  - {id: conversiongap, kind: activity, lane: Core, label: "retains returned cleanup-error partial or missing-material partial/queued status and usable raw extraction; absent content receives no reading credit"}
  - {id: conversionfallback, kind: activity, lane: Core, label: "keeps unmapped cleanup unused; restores original page-mapped text; parse may complete only when usable text and no other gap remain"}
  - {id: conversionoutage, kind: activity, lane: Core, label: "records transport code, attempts, retry-after and known/unknown cost; defers further equivalent calls on the failed route pending bounded direction"}
  - {id: conversionroute, kind: decision, lane: Lead (tier 1), label: "retry affected conversion within the grant, retain fallback, or pause the affected work?"}
  - {id: dconversionretry, kind: decision, lane: Core, label: "retry counter, backoff, current qualification and existing grant permit this same-route attempt?"}
  - {id: a7, kind: activity, lane: Clerk (tier 2), step: 7, label: "assigns bounded part-reading tasks to Scribes, keeping source description separate from the requesting project's fit judgement"}
  - {id: a8, kind: activity, lane: Scribe (tier 3), step: 8, label: "reads assigned parts and returns located source-stated points, limits, term usages and candidate reasoning stances"}
  - {id: host, kind: activity, lane: Model host, label: "answers the bounded tasks through qualified role assignments and the existing task pool"}
  - {id: a9, kind: activity, lane: Core, step: 9, label: "checks task schemas, literal quote locations and current-text receipt keys; counts completed parts and records queued or refused tasks"}
  - {id: dreadtransport, kind: decision, lane: Core, label: "recorded transport incident, critical flag or application task result?"}
  - {id: readoutage, kind: activity, lane: Core, label: "records 429/timeout/unavailable route and bounded attempts; defers equivalent failed-route calls; retains task gaps, receipts and unpriced cost"}
  - {id: readroute, kind: decision, lane: Lead (tier 1), label: "retry only pending affected tasks within the grant, keep queued gaps, or pause?"}
  - {id: dreadretry, kind: decision, lane: Core, label: "same-route pending-task retry within counters, backoff, qualification and existing authority?"}
  - {id: a10, kind: activity, lane: Clerk (tier 2), step: 10, label: "proofreads the readings and directs the existing lens chain: perspective, attention, blind challenge, role, probe and synthesis"}
  - {id: a11, kind: activity, lane: Clerk (tier 2), step: 11, label: "reconciles the accumulated readings across the source, corroborates supported stances and resolves probes; records unfinished required derivations separately"}
  - {id: dread, kind: decision, lane: Core, label: "recorded part-reading and required-derivation status?"}
  - {id: partialread, kind: activity, lane: Core, label: "keeps completed part coverage separate from queued derivations and unread parts; later applicable stages use only the evidence actually obtained"}
  - {id: a12, kind: activity, lane: Core, step: 12, label: "lenses: schema-checks and persists agent-submitted proposals, dispositions, citations and discard reasons; keeps acceptance separate"}
  - {id: dlenses, kind: decision, lane: Core, label: "lenses stage failed?"}
  - {id: a13, kind: activity, lane: Clerk (tier 2), step: 13, label: "data: proposes the organization of components, chapters and source claims using the readings and script-derived source structure"}
  - {id: ddata, kind: decision, lane: Core, label: "Data proposal schema, reference and write status?"}
  - {id: a14, kind: activity, lane: Clerk (tier 2), step: 14, label: "relate: relates fully read components with evidence, preserving inferred document relations and structurally observed repository relations"}
  - {id: drelate, kind: decision, lane: Core, label: "relate stage failed?"}
  - {id: a15, kind: activity, lane: Clerk (tier 2), step: 15, label: "metadata: proposes content-model field values from the evidence, explains Unknowns and submits the proposal for acceptance"}
  - {id: dmetadata, kind: decision, lane: Core, label: "metadata proposal field, schema and write status?"}
  - {id: a16, kind: activity, lane: Clerk (tier 2), step: 16, label: "review: produces a grounded, kind-specific source draft and Bottom Line with evidence, coverage and explicit unread material"}
  - {id: dreview, kind: decision, lane: Core, label: "source review failed?"}
  - {id: a17, kind: activity, lane: Core, step: 17, label: "publish: checks full reading/conversion, artifact binding and projection compatibility; freshly validates enabled, accepted, current, trusted folder assignment"}
  - {id: dpublication, kind: decision, lane: Core, label: "paper publication applicability and preparation?"}
  - {id: a18, kind: activity, lane: Geo-Grapher, step: 18, label: "revalidates folder/artifact admission and publishes the eligible reading claims; reports actual result or late refusal; Source acceptance is separate"}
  - {id: dpubresult, kind: decision, lane: Core, label: "publication result?"}
  - {id: pubna, kind: activity, lane: Core, label: "records publication as not applicable for a non-PDF or a fully read PDF lacking a full-conversion artifact; retains its limitation"}
  - {id: pubgap, kind: activity, lane: Core, label: "retains reading and the exact publication gap: FOLDER_STALE, awaiting_accepted_folder, disabled Geo, stale artifact or returned/caught failure"}
  - {id: itemfailed, kind: activity, lane: Core, label: "records the failed stage and noncritical ticket; retains the item's completed work and leaves other frozen items runnable"}
  - {id: a19, kind: activity, lane: Clerk (tier 2), step: 19, label: "assembles the source enrichment proposal and reconciles its content, explaining gaps in reading, derivations, drafts or publication for the Oracle"}
  - {id: dmore, kind: decision, lane: Core, label: "unprocessed entries remain in the pinned source list?"}
  - {id: a20, kind: activity, lane: Oracle, step: 20, label: "judges the enrichment package against its specification: deterministic checks first, then isolated model judgement, with evidence for the verdict"}
  - {id: dverdict, kind: decision, lane: Oracle, label: "enrichment verdict?"}
  - {id: rwork, kind: ref, lane: Doctor, use_case: UC-D, label: "remedies a mapped enrichment shortfall, then returns the repair for independent Oracle recheck"}
  - {id: resume, kind: activity, lane: Core, label: "checks requested scope and compatible receipts; unfinished work resumes pinned inputs; finished partials need re-approval/new batch; publication gets fresh admission"}
  - {id: dresume, kind: decision, lane: Core, label: "repair re-entry authorized and within the remaining allowance?"}
  - {id: repairperson, kind: activity, lane: Owner, label: "decides the explicit re-approval or additional authority needed for the affected repair work"}
  - {id: drepairperson, kind: decision, lane: Owner, label: "repair re-entry approved?"}
  - {id: scout, kind: activity, lane: Clerk (tier 2), label: "investigates an unmapped shortfall from evidence and directs bounded Scribe scouting tasks"}
  - {id: realign, kind: activity, lane: Lead (tier 1), label: "re-aligns within the specification using permitted actions; proposes new remedies for Owner acceptance rather than adding them itself"}
  - {id: drealign, kind: decision, lane: Lead (tier 1), label: "does the proposed correction address the cause with evidence of progress?"}
  - {id: partialreport, kind: activity, lane: Lead (tier 1), label: "returns partial coverage and verdict to the invoking parent or standalone commissioner, with separate Source/lens worklists, named owners and known/unknown spend"}
  - {id: a21, kind: activity, lane: Lead (tier 1), step: 21, label: "hands back verdict, evidence, coverage, known/unknown spend and tickets; names separate owners and current states for Source and lens decisions"}
  - {id: drecipient, kind: decision, lane: Core, label: "recorded invoking parent or standalone specification owner?"}
  - {id: parentreturn, kind: activity, lane: Core, label: "returns the child package and verdict to the invoking parent, which owns acceptance and the final Owner or tier-0 handoff"}
  - {id: a22, kind: activity, lane: Tier 0 agent, step: 22, label: "reviews the handback once against the delegated goal without repeating the workers' tasks"}
  - {id: dhandback, kind: decision, lane: Tier 0 agent, label: "handback meets the delegated goal?"}
  - {id: tidy, kind: activity, lane: Tier 0 agent, label: "returns evidence for one bounded tidy-up and independent recheck; the Lead and Doctor do work, the Oracle judges"}
  - {id: dtidy, kind: decision, lane: Core, label: "within the declared tidy-up and final-pass allowance?"}
  - {id: a23, kind: activity, lane: Tier 0 agent, step: 23, label: "returns the result to its active project or reports it to the Owner, with the remaining acceptance step explicit"}
  - {id: directreport, kind: activity, lane: Owner, label: "receives the Lead's enrichment result and Oracle verdict directly"}
  - {id: delivered, kind: activity, lane: Core, label: "records handback and separate Source-acceptance/lens-review worklists with actual states and owners; neither decision is implied by enrichment"}
  - {id: paused, kind: activity, lane: Lead (tier 1), label: "explains the pause, retained work and next decision or continuation needed; submits the checkpoint notice for delivery"}
  - {id: escalated, kind: activity, lane: Lead (tier 1), label: "explains the unresolved issue, evidence and required intervention to tier 0 or the Owner, with completed and partial work accounted for"}
  - {id: critical, kind: activity, lane: Owner, label: "receives critical security, data-loss or authority-boundary evidence immediately, with tier 0 when present"}
  - {id: e1, kind: end, outcome: success, label: "the enrichment specification is met; grounded outputs and the separate acceptance obligation are handed back"}
  - {id: epartial, kind: end, outcome: partial, label: "a permitted partial enrichment is returned with its true coverage and remaining work"}
  - {id: enowork, kind: end, outcome: reused, label: "no source work was admitted; the caller retains the accounted no-work result"}
  - {id: epaused, kind: end, outcome: paused, label: "the affected enrichment is paused for an explicit decision or authorized continuation"}
  - {id: eescalated, kind: end, outcome: escalated, label: "the accountable actor receives the unresolved or critical enrichment failure"}
