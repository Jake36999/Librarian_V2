perspective: Owner
problem:
  symptom: 30 graphs use 77.2 GB (up to 19.5 GB for a docs graph, 96 paper-DB copies = 873 MB for a 16 MB DB), 48 published
    NFL papers lack Source notes, 12 unread RL papers have 0 claims, 72 NFL papers have 0 concepts, 0 bridges exist, and TypeScript
    AST parsing fails silently.
  why:
  - Code/doc graph building runs upstream at folder acceptance (not during enrichment) and rebuilds every reviewed group non-incrementally
    (OP2) without pruning snapshots.
  - Paper graph building is bolted onto enrichment stage 9 via a per-paper CLI subprocess that clones the full prior paper
    DB without pruning generations or checkpointing catalog.sqlite-wal.
  - Geo-Grapher has zero involvement during enrichment stages 3-8, builds zero bridges, hides CLI errors behind opaque publish:partial,
    and lacks post-publish verification or acceptance hand-off.
  root: Graph building is split across two disconnected serial CLI subprocesses with whole-store copy/rebuild amplification,
    no enrichment feedback loop, and no end-to-end verification or hand-off (mirroring OP1 and OP2).
