# Handoff review by tools/s6_handoff_fixes.py (2026-11-26).
diagram: federated-search
use_case: UC-G4
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-25-systems-analysis-finalisation/geo-grapher/as-is/federated-search.spec.yaml
kind: activity
title: Search across graphs and their bridges (proposed)
problem:
  symptom: 'As-is: no bridges exist; the computed candidates go nowhere.'
  root: A candidate bridge is checked against its witnesses and decided like any other proposal; accepted bridges connect
    the results.
lanes:
- Owner
- Lead (tier 1)
- Geo-Grapher service
- Oracle
nodes:
- id: s
  kind: start
  label: start
- id: choose
  kind: activity
  lane: Lead (tier 1)
  label: chooses 2-8 graphs, a query and a budget
  step: 1
- id: dvalid
  kind: decision
  lane: Geo-Grapher service
  label: within the bounds?
- id: invalid
  kind: activity
  lane: Geo-Grapher service
  label: refuses and names the bound
- id: search
  kind: activity
  lane: Geo-Grapher service
  label: searches each readable graph whole and selects envelopes under the budget
  step: 2
- id: answer
  kind: activity
  lane: Geo-Grapher service
  label: returns per-graph rankings, each omission's reason, and the accepted bridges between the hits
  step: 3
- id: dbridged
  kind: decision
  lane: Lead (tier 1)
  label: do accepted bridges relate the results?
- id: propose
  kind: activity
  lane: Geo-Grapher service
  label: proposes bridge candidates between the hit entities, with their witnesses
- id: check
  kind: activity
  lane: Oracle
  label: checks each candidate's witnesses (Tier A) before anyone decides
- id: decide
  kind: activity
  lane: Owner
  label: 'decides the checked candidates: the Owner, or a standing policy for a kind the Owner has accepted'
- id: ddecide
  kind: decision
  lane: Owner
  label: accepted?
- id: compare
  kind: activity
  lane: Lead (tier 1)
  label: relates the graphs' results through their bridges
  step: 4
- id: e1
  kind: end
  outcome: success
  label: the graphs' results are related through accepted bridges
- id: e_refused
  kind: end
  outcome: refused
  label: out of bounds
edges:
- from: s
  to: choose
- from: choose
  to: dvalid
- from: dvalid
  to: search
  guard: 'yes'
- from: dvalid
  to: invalid
  guard: 'no'
  ext: 2a
- from: invalid
  to: e_refused
- from: search
  to: answer
- from: answer
  to: dbridged
- from: dbridged
  to: compare
  guard: 'yes'
- from: dbridged
  to: propose
  guard: 'no'
  ext: 4a
- from: propose
  to: check
- from: check
  to: decide
- from: decide
  to: ddecide
- from: compare
  to: e1
- from: ddecide
  to: compare
  guard: 'accepted: related through the new bridges'
- from: ddecide
  to: compare
  guard: 'rejected: compared without them, the rejection recorded'
