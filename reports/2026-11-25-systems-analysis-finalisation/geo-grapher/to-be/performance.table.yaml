title: Performance (baselines, metrics and targets)
about: 'For each proposed improvement, the current baseline with its provenance, the metric to measure, and the target, or
  the decision still needed. Provenance: M = measured by a re-runnable script; R = reported by an earlier session (the 22
  November graph-building review), not re-measured here; C = read from the code. No target has been measured against a running
  system.'
sections:
- heading: Geo-Grapher
  columns:
  - Improvement
  - Baseline
  - Metric
  - Target or decision needed
  - Where
  rows:
  - - Apply only the decided group
    - 'C: every accept loops over every reviewed group (geographer/folder_review.py 128-131), under a 14,400 s timeout'
    - groups touched and seconds per accept
    - 'groups touched = 1; time: decision needed (no per-group time measured)'
    - '`graph-building:submit`'
  - - Delta snapshots, with retention
    - 'R: 77.2 GB for 30 graphs, up to 19.5 GB for one documentation graph'
    - store bytes per graph; growth per apply
    - growth in proportion to the change; the retention numbers are a decision
    - '`graph-building:prune`'
  - - One active paper database
    - 'R: 96 copies take 873 MB for one 16 MB database; C: a full copy per paper (library_papers.py publish)'
    - files per graph; bytes written per paper
    - one active file plus pinned snapshots; bytes per paper in proportion to the paper
    - '`paper-import:insert`'
  - - A running import service
    - 'C: one cold-start CLI subprocess per PDF'
    - seconds per paper import
    - 'decision needed: no per-paper time measured'
    - '`paper-import:send`'
  - - A reserve sized to the paper
    - 'C: 100 MB + 2 x the prior database + 20 x the conversion, against 5 GiB free (library_papers.py 75-77)'
    - DISK_RESERVE refusals per 100 papers at a steady disk
    - '0'
    - '`paper-import:dscope`'
  - - Checkpoint after each write
    - 'R: no WAL checkpoint after a build'
    - WAL size after an apply
    - checkpointed after every transaction
    - '`graph-building:write`'
  - - Content checked before complete
    - 'R: 12 papers with 0 claims and 72 with 0 concepts recorded complete'
    - papers recorded complete with 0 claims or concepts
    - '0'
    - '`paper-import:dcontent`'
  - - Import papers in a batch session
    - 'C: one subprocess per paper'
    - seconds per paper across a batch
    - 'decision needed: whether a batch session is worth it once the service is running'
    - '`paper-import:send`'
