# Risk routing and the licence hold, by tools/s8_risk_and_licence.py (2026-11-26).
diagram: catalogue
use_case: UC8.2
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-20-workflow-map/examples/ingestion/compose.spec.yaml
kind: activity
title: Compose a process and promote it into the repertoire (proposed)
problem:
  symptom: 'Canonicalisation kept the sprint-level compose and dropped the repertoire''s lifecycle: duplicates, the Owner''s
    acceptance, the pinned digest.'
  root: A process is reused if one is accepted, composed under the layer rule if not, and kept only through the Owner's acceptance,
    stored in the Core.
evidence:
- docs/proposals/diagram-workflows.md sections 11.1 (layer table), 11.3 (UC-C), 11.7 (manifests).
- 'docs/policy/agent-roles-and-authority.md: specifications belong within the Librarian Core.'
target:
  kind: use_case
  ref: ../../../../docs/proposals/diagram-workflows.md#11-upward-composition-actions-workflows-pipelines-sprints
lens:
- the-root-cause-lens
- the-guard-completeness-lens
perspective: Owner
lanes:
- Owner
- Oracle
- Lead (tier 1)
- Core
nodes:
- id: s
  kind: start
- id: a1
  kind: activity
  lane: Lead (tier 1)
  label: needs a capability its task calls for
  step: 1
- id: a2
  kind: activity
  lane: Core
  label: searches the repertoire, the Core's store of accepted processes, for one that covers it, lowest layer first
  step: 2
- id: d1
  kind: decision
  lane: Core
  label: an accepted process covers it?
- id: a3
  kind: activity
  lane: Lead (tier 1)
  label: drafts a process at the layer the task needs, from accepted processes as its components
  step: 3
- id: a4
  kind: activity
  lane: Core
  label: 'validates the draft: schema, references, arguments and outputs, and that no step declares less than its action''s
    registered effects'
  step: 4
- id: d2
  kind: decision
  lane: Core
  label: draft valid?
- id: x1
  kind: activity
  lane: Lead (tier 1)
  label: revises the draft from the named problems
- id: d3
  kind: decision
  lane: Lead (tier 1)
  label: within two revisions?
- id: a5
  kind: activity
  lane: Core
  label: 'validates the layer rule: an action has no components; a workflow holds actions and, without a cycle, workflows;
    a pipeline holds workflows and actions; a sprint holds pipelines, workflows and actions'
  step: 5
- id: d4
  kind: decision
  lane: Core
  label: layer rule holds?
- id: x2
  kind: activity
  lane: Lead (tier 1)
  label: recomposes the draft from processes of earlier layers
- id: a6
  kind: activity
  lane: Core
  label: 'compiles the manifest: the component tree, the actions in order, their declared effects, tier and outside access,
    and the blast radius'
  step: 6
- id: d5
  kind: decision
  lane: Core
  label: 'does the manifest fit the parent''s mandate: tier, effects, outside access and deny list?'
- id: x3
  kind: activity
  lane: Lead (tier 1)
  label: puts the wider radius on the Owner's agenda as one reserved decision, with the manifest and its evidence; tier 0,
    when it oversees the run, is told in its handover and never asked to relay it
- id: x5
  kind: activity
  lane: Owner
  label: decides the wider radius
- id: d6
  kind: decision
  lane: Owner
  label: Owner approves?
- id: a7
  kind: activity
  lane: Oracle
  label: 'dry-runs the draft against its specification: Tier A checks, then a Tier B review'
  step: 7
- id: d7
  kind: decision
  lane: Oracle
  label: specification met?
- id: x6
  kind: activity
  lane: Lead (tier 1)
  label: revises the draft from the oracle's report
- id: a8
  kind: activity
  lane: Core
  label: runs the process for the task, pinned to its digest
  step: 8
- id: a9
  kind: activity
  lane: Lead (tier 1)
  label: proposes promoting the process into the repertoire
  step: 9
- id: a10
  kind: activity
  lane: Core
  label: checks the proposal against the repertoire for duplicates, and puts it on the Owner's agenda
  step: 10
- id: d8
  kind: decision
  lane: Core
  label: duplicates an accepted process?
- id: a11
  kind: activity
  lane: Owner
  label: accepts the process into the repertoire
  step: 11
- id: d9
  kind: decision
  lane: Owner
  label: accepted?
- id: a12
  kind: activity
  lane: Core
  label: stores the specification in the Core, pins its digest, and records its manifest and provenance
  step: 12
- id: xe
  kind: activity
  lane: Lead (tier 1)
  label: 'hands the draft and its two revisions to the specification''s owner: tier 0 when it oversees the run, otherwise
    the Owner, on the agenda'
- id: xp
  kind: activity
  lane: Core
  label: records the paused composition and the Owner's reason; the specification's owner is told in its handover
- id: e1
  kind: end
  outcome: success
  label: the process is in the repertoire, available as a component of any later parent process
- id: e2
  kind: end
  outcome: reused
  label: an accepted process is used; nothing new is added
- id: e3
  kind: end
  outcome: used once
  label: the process ran for this task and was not kept
- id: e4
  kind: end
  outcome: escalated
  label: 'escalated to the specification''s owner: a failure of this use case'
- id: e5
  kind: end
  outcome: paused
  label: 'paused: the Owner declined the wider radius'
