# Correction round by tools/s5_regression_fixes.py (2026-11-26).
diagram: acceptance
use_case: UC1.3
status: PROPOSED_UNACCEPTED
kind: activity
title: Accept the screened sources (proposed)
lanes:
- Owner
- Lead (tier 1)
- Core
nodes:
- id: s
  kind: start
  label: start
- id: dgate2
  kind: decision
  lane: Core
  label: Gate 2 acceptance authority?
- id: leadaccept
  kind: activity
  lane: Lead (tier 1)
  label: accepts the in-scope sources and folder cards when the Owner has set promotion mode to agent, recorded as accepted
    by an agent; an item with a sensitivity flag or a low-confidence draft goes to the Owner
  step: 1
- id: dgate2caller
  kind: decision
  lane: Core
  label: interactive Specification owner present?
- id: ownergate2
  kind: decision
  lane: Owner
  label: 'the Owner''s one consolidated decision: which folders, sources, lenses and topics?'
- id: promote
  kind: activity
  lane: Core
  label: commits the accepted sources through the guarded writer (compare-and-set over the files it writes), indexes them,
    and hands any undecided candidates on
  step: 2
- id: e_success
  kind: end
  outcome: success
  label: the accepted sources are committed
- id: e_held_for_the_Owner
  kind: end
  outcome: held for the Owner
  label: the choice is on the Owner's agenda
- id: e_paused
  kind: end
  outcome: paused
  label: held or deferred
edges:
- from: s
  to: dgate2
- from: dgate2
  to: leadaccept
  guard: within tier 0's commission, or a standing agent policy
- from: dgate2
  to: dgate2caller
  guard: 'outside it: an external project may not accept, the Web UI person reviews, a taxonomy change, or a reserved decision'
  ext: 1a
- from: dgate2caller
  to: ownergate2
  guard: the Owner is present, in the Web UI
- from: dgate2caller
  to: e_held_for_the_Owner
  guard: no person present (an external project or a scheduled run)
- from: ownergate2
  to: promote
  guard: accept selected items
- from: ownergate2
  to: e_paused
  guard: hold or defer all
- from: leadaccept
  to: promote
- from: promote
  to: e_success
