# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: activation-overseer
use_case: UC0
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-context1-tier0-delegated.spec.yaml
title: Work for the Owner as tier 0 (proposed)
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/to-be/activation-overseer.spec.yaml
problem:
  symptom: 'As-is: tier 0 is refused the curate tier, stalls on hidden 150- and 600-second permission asks, is asked to approve
    twice, and has to watch low-value steps.'
  root: 'The Owner''s instruction and scope are the commission: tier 0 approves the permission envelope once on the Owner''s
    behalf, delegates the work to the Lead and the shared pipeline, and hands back one receipt.'
lanes:
- Lead (tier 1)
- Doctor
- Oracle
- Core
- Overseer (tier 0)
- Owner
nodes:
- id: s
  kind: start
  label: start
- id: request
  kind: activity
  lane: Owner
  step: 1
  label: 'instructs tier 0 with the task, scope, exclusions and budget: the instruction and its scope are the commission'
- id: commission
  kind: activity
  lane: Overseer (tier 0)
  step: 2
  label: writes the sprint's specification on the Owner's behalf and approves its permission envelope once, with no second
    ask
- id: denv
  kind: decision
  lane: Core
  label: are the commissioned specification and scope well formed?
- id: pausecancel
  kind: activity
  lane: Core
  label: logs malformed commission or out-of-scope mismatch without mutating vault; sets resume note
- id: t0cancel
  kind: activity
  lane: Overseer (tier 0)
  label: reports the rejected commission and what needs clarifying, with nothing spent
- id: storeenv
  kind: activity
  lane: Core
  step: 3
  label: stores the specification and its mandate (commissioned by the person, decided by the agent) and grants the delegated
    in-scope permissions
- id: policy_note
  kind: note
  lane: Core
  label: 'Proposed: full in-scope delegation to tier 0. Sensitivity and challenged-claim exceptions stay flagged for the Owner
    (an open Owner decision).'
- id: leaddispatch
  kind: activity
  lane: Lead (tier 1)
  step: 4
  label: owns the delegated pipeline run, never wider than its parent, and routes work to Clerks and Scribes
- id: callingest
  kind: ref
  lane: Core
  step: 5
  use_case: ingestion
  label: runs the shared ingestion pipeline, its batch and each source's workflow, under the commission
- id: dcrit
  kind: decision
  lane: Core
  label: a critical security, data-loss or boundary breach, rather than a mapped shortfall?
- id: partbranch
  kind: activity
  lane: Core
  label: weighs the permitted partial coverage and spend against the sprint's acceptance criteria
- id: dpperm
  kind: decision
  lane: Core
  label: partials acceptable for sprint?
- id: partnotify
  kind: activity
  lane: Overseer (tier 0)
  label: tells the Owner the coverage, spend, what was not examined, the deferred decisions and the open tickets
- id: reusehand
  kind: activity
  lane: Core
  label: packages the reused receipts and the unchanged source list, at no spend
- id: t0notifyreuse
  kind: activity
  lane: Overseer (tier 0)
  label: tells the Owner nothing changed, with the evidence hashes and no duplicate spend
- id: t0ticket
  kind: activity
  lane: Core
  label: 'records a paused ticket (its id, flags, spend and resume point): out of scope, budget, a library-wide change, or
    a reserved decision'
- id: t0surface
  kind: activity
  lane: Overseer (tier 0)
  label: puts one structured question to the Owner (a boundary, a reserved decision or a route collision) with where to resume
- id: userchoice
  kind: activity
  lane: Owner
  label: decides the boundary, hazard or route exception, and gets the exact place on the agenda to resume
- id: collisionrec
  kind: activity
  lane: Core
  label: 'records the review as unverified, with a ticket: no Oracle route distinct from the workers'' (never marked as independently
    reviewed)'
- id: doctortriage
  kind: ref
  lane: Doctor
  use_case: doctor
  label: attempts a bounded repair of the sprint's ticket
- id: reentrydoc
  kind: activity
  lane: Core
  label: checks the repair's progress and prepares the Oracle's independent recheck
- id: declinerec
  kind: activity
  lane: Core
  label: keeps the declined ticket, its attempts and the compensation shown on the agenda
- id: t0decline
  kind: activity
  lane: Overseer (tier 0)
  label: reports the open ticket, the declined remedy, the spend and the compensation shown
- id: escrec
  kind: activity
  lane: Core
  label: routes the critical ticket at once, with its flags, evidence hashes and the compensation shown
- id: failnotify
  kind: activity
  lane: Overseer (tier 0)
  label: alerts the Owner at once with the critical ticket, evidence, spend and state
- id: useresc
  kind: activity
  lane: Owner
  label: receives the urgent failure alert and the ticket's link
- id: oraclesprint
  kind: activity
  lane: Oracle
  step: 6
  label: audits the sprint's obligations on a route distinct from the workers'
- id: dverdict
  kind: decision
  lane: Oracle
  label: are the sprint's obligations met?
- id: packagereceipt
  kind: activity
  lane: Core
  step: 7
  label: 'commits the delivery receipt: accepted notes, spend, coverage, deferred decisions, tickets and agenda'
- id: t0deliver
  kind: activity
  lane: Overseer (tier 0)
  step: 8
  label: 'writes the final handover: evidence, spend, coverage, deferred work, review status and tickets'
- id: userreuse
  kind: activity
  lane: Owner
  label: receives confirmation of reused catalogue state (zero duplicate spend)
- id: userpartial
  kind: activity
  lane: Owner
  label: receives the permitted partial report, what was not examined and the open tickets
- id: userdecline
  kind: activity
  lane: Owner
  label: receives the open ticket, the declined remedy and the compensation plan
- id: usercancel
  kind: activity
  lane: Owner
  label: receives the rejected commission and what needs clarifying; the library is unchanged
- id: userack
  kind: activity
  lane: Owner
  step: 9
  label: receives the completion notice in the chat or IDE session, and the receipt on the agenda
- id: e1
  kind: end
  outcome: success
  label: the sprint is done; the Owner has the Oracle-verified evidence and the agenda
- id: epartial
  kind: end
  outcome: partial
  label: done with permitted partials; the Owner has what was not examined and the tickets
- id: ereused
  kind: end
  outcome: reused
  label: existing catalogue state reused cleanly; user notified with zero duplicate work
- id: epaused
  kind: end
  outcome: paused
  label: paused on a boundary, a hazard, a route collision or a declined commission; the Owner is told
- id: eescalated
  kind: end
  outcome: escalated
  label: a critical ticket escalated with its evidence; the Owner is alerted at once
edges:
- from: s
  to: request
- from: request
  to: commission
- from: commission
  to: denv
- from: denv
  to: storeenv
  guard: valid delegated commission
- from: denv
  to: pausecancel
  guard: malformed spec or exceeds user-stated scope
  ext: 2a
- from: storeenv
  to: policy_note
- from: policy_note
  to: leaddispatch
- from: leaddispatch
  to: callingest
- from: callingest
  to: oraclesprint
  guard: success
- from: callingest
  to: partbranch
  guard: partial
  ext: 5a
- from: callingest
  to: reusehand
  guard: reused
  ext: 5b
- from: callingest
  to: t0ticket
  guard: paused
  ext: 5c
- from: callingest
  to: dcrit
  guard: escalated
  ext: 5d
- from: dcrit
  to: escrec
  guard: critical security, data-loss, or boundary violation
- from: dcrit
  to: doctortriage
  guard: a mapped, non-critical shortfall
- from: partbranch
  to: dpperm
- from: dpperm
  to: oraclesprint
  guard: within sprint partial allowance
- from: dpperm
  to: partnotify
  guard: partial exceeds sprint tolerance
- from: partnotify
  to: userpartial
- from: userpartial
  to: epartial
- from: reusehand
  to: t0notifyreuse
- from: t0notifyreuse
  to: userreuse
- from: userreuse
  to: ereused
- from: t0ticket
  to: t0surface
- from: t0surface
  to: userchoice
- from: userchoice
  to: epaused
- from: pausecancel
  to: t0cancel
- from: t0cancel
  to: usercancel
- from: usercancel
  to: epaused
- from: doctortriage
  to: reentrydoc
  guard: resolved
- from: reentrydoc
  to: oraclesprint
- from: doctortriage
  to: declinerec
  guard: declined
- from: declinerec
  to: t0decline
- from: t0decline
  to: userdecline
- from: userdecline
  to: epaused
- from: doctortriage
  to: escrec
  guard: escalated
- from: escrec
  to: failnotify
- from: failnotify
  to: useresc
- from: useresc
  to: eescalated
- from: oraclesprint
  to: dverdict
- from: dverdict
  to: packagereceipt
  guard: satisfied (distinct route pass)
- from: dverdict
  to: partnotify
  guard: minor partial within tolerance
  ext: 6a
- from: dverdict
  to: doctortriage
  guard: mapped noncritical sprint shortfall
  ext: 6b
- from: dverdict
  to: escrec
  guard: critical integrity or boundary finding
  ext: 6c
- from: dverdict
  to: collisionrec
  guard: no Oracle route distinct from the workers' (never marked as independently reviewed)
  ext: 6d
- from: collisionrec
  to: t0surface
- from: packagereceipt
  to: t0deliver
- from: t0deliver
  to: userack
- from: userack
  to: e1
