# Geo-Grapher woven in by tools/s9_weave.py (2026-11-26).
diagram: folder-review
use_case: UC1.1
status: PROPOSED_UNACCEPTED
kind: activity
title: Review a folder and apply its group (proposed)
lanes:
- Owner
- Lead (tier 1)
- Clerk (tier 2)
- Doctor
- Oracle
- Core
- Geo-Grapher
nodes:
- id: s
  kind: start
  label: start
- id: rootinv
  kind: activity
  lane: Core
  label: surveys the roots, fingerprints, licences and exclusions at no cost, reusing the folder receipts already held
  step: 1
- id: droot
  kind: decision
  lane: Core
  label: are the roots current, and the folder route qualified?
- id: doctorroot
  kind: ref
  lane: Doctor
  use_case: doctor
  label: attempts a scoped repair of a stale root or a lost route, once
- id: reentryroot
  kind: activity
  lane: Core
  label: checks the single repair's progress
- id: folderscreen
  kind: activity
  lane: Clerk (tier 2)
  label: screens only the new or ambiguous folders for purpose, authorship and sensitivity, without reading documents; an
    unlicensed repository is an external source, labelled and never withheld
  step: 2
- id: dfolderauth
  kind: decision
  lane: Core
  label: is the folder decision within tier 0's commission or a standing policy?
- id: leadfolder
  kind: activity
  lane: Lead (tier 1)
  label: decides the in-scope folders the Clerk screened as not sensitive, under the commission or standing policy, and applies
    the exclusions; a sensitivity flag goes to the Owner
  step: 3
- id: dheldcaller
  kind: decision
  lane: Core
  label: interactive Specification owner available?
- id: ownerfolder
  kind: decision
  lane: Owner
  label: Owner reserved folder choice?
- id: excl
  kind: activity
  lane: Core
  label: records excluded subtree and read barrier
- id: folderapply
  kind: activity
  lane: Core
  label: submits only the changed or selected group
  step: 4
- id: geoapply
  kind: ref
  lane: Geo-Grapher
  label: applies the one decided group in Geo-Grapher as a delta, and returns its receipt (UC-G1)
  use_case: geo-grapher/to-be/graph-building
  step: 5
- id: dgeo
  kind: decision
  lane: Core
  label: 'does the receipt match the one decided group: its fingerprint, coverage and changed entities?'
- id: doctorgeo
  kind: ref
  lane: Doctor
  use_case: doctor
  label: repairs the group or the service through a ticket, without rebuilding the library
- id: reentrygeo
  kind: activity
  lane: Core
  label: confirms single-pass Geo recovery receipt
- id: oraclecov
  kind: decision
  lane: Oracle
  label: degraded parse within caller tolerance?
- id: m_success
  kind: merge
  lane: Core
  label: the ways to the folder's group is applied, its inputs known meet
- id: markstale
  kind: activity
  lane: Core
  label: records the receipt, and marks the notes and claims that cite a changed entity as stale, for the Oracle's recheck
  step: 6
- id: e_success
  kind: end
  outcome: success
  label: the folder's group is applied, its inputs known
- id: e_held_for_the_Owner
  kind: end
  outcome: held for the Owner
  label: a reserved folder decision is on the Owner's agenda
- id: e_paused
  kind: end
  outcome: paused
  label: held or declined
- id: e_escalated
  kind: end
  outcome: escalated
  label: a critical security or data fault
edges:
- from: s
  to: rootinv
- from: rootinv
  to: droot
- from: droot
  to: folderscreen
  guard: current, and the route is ready
- from: droot
  to: doctorroot
  guard: a stale root, or the route's qualification lost
  ext: 2a
- from: droot
  to: e_escalated
  guard: critical security, data-loss, or authority breach
  ext: 2b
- from: doctorroot
  to: reentryroot
  guard: resolved
- from: reentryroot
  to: folderscreen
- from: doctorroot
  to: e_paused
  guard: declined
- from: doctorroot
  to: e_escalated
  guard: escalated
- from: folderscreen
  to: dfolderauth
- from: dfolderauth
  to: leadfolder
  guard: within the commission, or a standing policy for non-sensitive folders
- from: dfolderauth
  to: dheldcaller
  guard: 'outside it: the person in the Web UI, an external project''s out-of-scope folder, linked content reaching outside
    the roots, or a reserved decision such as a sensitivity flag (licence status alone is never a reason)'
  ext: 3a
- from: dheldcaller
  to: ownerfolder
  guard: the Owner is present, in the Web UI
- from: dheldcaller
  to: e_held_for_the_Owner
  guard: 'no person present (tier 0 over MCP, an external project, a scheduled run): put it on the agenda without blocking'
- from: ownerfolder
  to: folderapply
  guard: approve
- from: ownerfolder
  to: excl
  guard: exclude subtree
- from: ownerfolder
  to: e_paused
  guard: hold or decline
- from: excl
  to: folderapply
- from: leadfolder
  to: folderapply
- from: folderapply
  to: geoapply
- from: doctorgeo
  to: reentrygeo
  guard: resolved
- from: reentrygeo
  to: m_success
- from: doctorgeo
  to: oraclecov
  guard: declined
- from: doctorgeo
  to: e_escalated
  guard: escalated
- from: oraclecov
  to: m_success
  guard: acceptable for scope (gap recorded)
- from: oraclecov
  to: e_paused
  guard: below required quality
- from: m_success
  to: markstale
- from: markstale
  to: e_success
- from: geoapply
  to: dgeo
  guard: success
- from: geoapply
  to: oraclecov
  guard: partial
  ext: 5a
- from: geoapply
  to: doctorgeo
  guard: refused
  ext: 5b
- from: dgeo
  to: m_success
  guard: it matches
- from: dgeo
  to: doctorgeo
  guard: the folder changed since the decision, or a mapped Geo-Grapher fault
  ext: 6a
- from: dgeo
  to: e_escalated
  guard: critical Geo DB or security violation
  ext: 6b
