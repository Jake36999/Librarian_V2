# Handoff review by tools/s6_handoff_fixes.py (2026-11-26).
diagram: activation-web-ui
use_case: UC0
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-context3-human-platform-ui.spec.yaml
title: Work directly in the Web UI (proposed)
problem:
  symptom: 'As-is: staging filters hide accepted and processing items, a background reload wipes the person''s edits, a workflow''s
    result is dropped (app.js:8472), and unfindable notes and queued Clerk work are invisible.'
  root: The Web UI starts the same parent processes with no tier 0; each decision (source, summary, folder, lens, topic, index)
    is separate and explicit, and every result is shown from the Core's record.
lanes:
- Clerk (tier 3)
- Doctor
- Oracle
- Core
- Lead (tier 1)
- Web UI
- Owner
nodes:
- id: s
  kind: start
  label: start
- id: ui_entry
  kind: activity
  lane: Owner
  label: 'starts in the Web UI: Add source or Folders in Staging, Chat with an attachment, or Run a workflow'
  step: 1
- id: dentry
  kind: decision
  lane: Web UI
  label: which direct UI path selected?
- id: leaddeleg
  kind: ref
  lane: Lead (tier 1)
  use_case: ingestion
  label: delegates a multi-folder Chat request, never wider than the person's own authority, with no tier 0
- id: wgrant
  kind: activity
  lane: Core
  label: grants the person's workflow, with the read access its steps need
- id: uicapture
  kind: activity
  lane: Core
  label: captures the evidence and records the staging and folder items, at the person's curate tier
  step: 2
- id: leadcoord
  kind: activity
  lane: Lead (tier 1)
  label: oversees the queued work started from the UI, within the person's authority, and shows queued Clerk work
  step: 3
- id: clerkdraft
  kind: activity
  lane: Clerk (tier 3)
  label: proposes a readable title, a neutral Bottom Line, what the source solves, its fields (Unknown where unsupported),
    topics and sensitivity
  step: 4
- id: reviewgate1
  kind: activity
  lane: Owner
  label: reviews the staged sources with their evidence beside them, and ticks or edits the Gate 1 items
  step: 5
- id: dgate1choice
  kind: decision
  lane: Owner
  label: Gate 1 Source choice on Staging page?
- id: uidispose
  kind: activity
  lane: Core
  label: defers the item, or quarantines a rejected one, with the reason and the originals kept
- id: startbatch
  kind: activity
  lane: Core
  label: clicks Process approved; the selected batch is frozen
  step: 6
- id: batchchild
  kind: ref
  lane: Core
  use_case: batch-enrichment
  label: runs the mixed batch under the person's start
  step: 7
- id: uidoctor
  kind: ref
  lane: Doctor
  use_case: doctor
  label: repairs the findability ticket (for example, re-indexing)
- id: uireentry
  kind: activity
  lane: Core
  label: confirms the repaired ticket and refreshes Search, for the Oracle's recheck
- id: reviewgate2
  kind: activity
  lane: Owner
  label: 'makes the Gate 2 choices: the summary (Bottom Line, redraft, unknowns), then folders, lenses, topics and offerings'
  step: 8
- id: dstale
  kind: decision
  lane: Web UI
  label: has the staged revision changed while the person was editing?
- id: keepdraft
  kind: activity
  lane: Web UI
  label: keeps the person's draft beside the new revision, shows the difference, and lets them carry their edits over
- id: dgate2choice
  kind: decision
  lane: Owner
  label: Gate 2 Source acceptance choice?
- id: promotepartial
  kind: activity
  lane: Core
  label: writes the Source note with partial coverage and what was not examined, and updates the indexes
- id: promoteindex
  kind: activity
  lane: Core
  label: checks the staged revision, writes the Source note through the guarded writer and indexes it
  step: 9
- id: oracleverify
  kind: activity
  lane: Oracle
  label: verifies the summary's integrity and the note's findability, full or partial, on a route distinct from the workers'
  step: 10
- id: dindex
  kind: decision
  lane: Oracle
  label: is the Source note findable, and do its checks pass?
- id: dkind
  kind: decision
  lane: Web UI
  label: was the note accepted with full or partial coverage?
- id: uinotify
  kind: activity
  lane: Web UI
  label: shows the result banner and a drawer with the run's result, spend and coverage, and the agenda
  step: 11
- id: userdone
  kind: activity
  lane: Owner
  label: receives the accepted Source note, the spend, the index confirmation and the deferred decisions, with no tier 0
  step: 12
- id: uipartial
  kind: activity
  lane: Web UI
  label: shows the partial coverage, the spend, what was not examined and the remaining agenda and staging counts
- id: userpartial
  kind: activity
  lane: Owner
  label: receives the accepted partial note with its coverage caveats, the spend and the deferred decisions
- id: uireused
  kind: activity
  lane: Web UI
  label: shows that nothing new was needed, with the unchanged catalogue links and no spend
- id: userreuse
  kind: activity
  lane: Owner
  label: receives confirmation that the catalogue is unchanged, with its links
- id: uiagenda
  kind: activity
  lane: Web UI
  label: updates the agenda and staging filters, and shows the workflow or ticket notice with its resume path
- id: userpaused
  kind: activity
  lane: Owner
  label: receives the paused ticket, any unverified-review flag, the spend and where to resume
- id: uiesc
  kind: activity
  lane: Web UI
  label: shows the critical or unresolved error at once, with the ticket, flags, evidence and the compensation shown
- id: useresc
  kind: activity
  lane: Owner
  label: receives the urgent failure alert, the ticket and the compensation plan
- id: e1
  kind: end
  outcome: success
  label: the source is findable in Search and the catalogue; the person is told, with no tier 0
- id: epartial
  kind: end
  outcome: partial
  label: accepted with explicit partial coverage or pending UI worklists; user notified
- id: ereused
  kind: end
  outcome: reused
  label: existing catalogue items confirmed unchanged; UI updated
- id: epaused
  kind: end
  outcome: paused
  label: the staged, deferred or paused item stays visible in Staging and on the agenda; the person is told
- id: eescalated
  kind: end
  outcome: escalated
  label: a critical UI or index ticket shown to the person with its evidence
edges:
- from: s
  to: ui_entry
- from: ui_entry
  to: dentry
- from: dentry
  to: uicapture
  guard: Add source in Staging, or Chat with an attachment
- from: dentry
  to: leaddeleg
  guard: Chat Lead delegates multi-root ingestion
  ext: 2a
- from: dentry
  to: wgrant
  guard: paperclip Run a workflow (e.g. deep-read-staged)
  ext: 2b
- from: leaddeleg
  to: uinotify
  guard: success
- from: leaddeleg
  to: uipartial
  guard: partial
- from: leaddeleg
  to: uireused
  guard: reused
- from: leaddeleg
  to: uiagenda
  guard: paused
- from: leaddeleg
  to: uiesc
  guard: escalated
- from: wgrant
  to: leadcoord
- from: uicapture
  to: leadcoord
- from: leadcoord
  to: clerkdraft
- from: clerkdraft
  to: reviewgate1
- from: reviewgate1
  to: dgate1choice
- from: dgate1choice
  to: startbatch
  guard: approve for ingestion, then click Process approved
- from: dgate1choice
  to: promoteindex
  guard: Accept as captured (skip batch)
  ext: 6a
- from: dgate1choice
  to: uidispose
  guard: Defer or Reject in Staging
  ext: 6b
- from: uidispose
  to: uiagenda
- from: startbatch
  to: batchchild
- from: batchchild
  to: reviewgate2
  guard: success
- from: batchchild
  to: reviewgate2
  guard: partial
  ext: 7a
- from: batchchild
  to: uireused
  guard: reused
  ext: 7b
- from: batchchild
  to: uiagenda
  guard: paused
  ext: 7c
- from: batchchild
  to: uiesc
  guard: escalated
  ext: 7d
- from: uidoctor
  to: uireentry
  guard: resolved
- from: uireentry
  to: oracleverify
- from: uidoctor
  to: uiagenda
  guard: declined
- from: uidoctor
  to: uiesc
  guard: escalated
- from: reviewgate2
  to: dstale
- from: dgate2choice
  to: promoteindex
  guard: accept into the library
- from: dgate2choice
  to: promotepartial
  guard: accept with partial coverage (what was not examined is recorded)
  ext: 9a
- from: dgate2choice
  to: uidispose
  guard: Defer or Reject
  ext: 9b
- from: promotepartial
  to: oracleverify
- from: promoteindex
  to: oracleverify
- from: oracleverify
  to: dindex
- from: dindex
  to: dkind
  guard: findable, and the checks pass on a distinct Oracle route
- from: dindex
  to: uidoctor
  guard: not findable, or embedding warnings
  ext: 11a
- from: dindex
  to: uiesc
  guard: critical Search-Index or data integrity fault
  ext: 11b
- from: dindex
  to: uiagenda
  guard: no Oracle route distinct from the workers' (never marked as independently reviewed)
  ext: 11c
- from: uinotify
  to: userdone
- from: userdone
  to: e1
- from: uipartial
  to: userpartial
- from: userpartial
  to: epartial
- from: uireused
  to: userreuse
- from: userreuse
  to: ereused
- from: uiagenda
  to: userpaused
- from: userpaused
  to: epaused
- from: uiesc
  to: useresc
- from: useresc
  to: eescalated
- from: dstale
  to: dgate2choice
  guard: unchanged
- from: dstale
  to: keepdraft
  guard: changed
  ext: 9c
- from: keepdraft
  to: reviewgate2
- from: dkind
  to: uinotify
  guard: full
- from: dkind
  to: uipartial
  guard: partial
  ext: 11d
