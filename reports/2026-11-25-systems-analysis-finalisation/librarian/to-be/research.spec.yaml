# Correction round by tools/s5_regression_fixes.py (2026-11-26).
diagram: research
use_case: UC2
status: PROPOSED_UNACCEPTED
supersedes: []
kind: activity
title: Research a brief across a corpus (proposed)
problem:
  symptom: 'As-is: the whole library as the pool, budgets that halve on return, one synthesis for every question, unchecked
    code placement, a broken disqualifier nobody caught.'
  root: The brief is scoped to its corpus, sized once, synthesised per question and judged against itself before it is handed
    over.
lanes:
- Owner
- Lead (tier 1)
- Clerk (tier 2)
- Scribe (tier 3)
- Oracle
- Core
- Geo-Grapher
nodes:
- id: s
  kind: start
  label: start
- id: brief
  kind: activity
  lane: Owner
  label: 'states the brief once: its questions, its corpus, its disqualifiers and a budget'
  step: 1
- id: dbrief
  kind: decision
  lane: Core
  label: are the corpus and the disqualifiers named?
- id: missing
  kind: activity
  lane: Core
  label: refuses to start and names the missing field
- id: manifest
  kind: activity
  lane: Core
  label: compiles the brief's manifest, sizes its budget from it and grants the envelope once
  step: 2
- id: open
  kind: activity
  lane: Lead (tier 1)
  label: opens one brief per question, each scoped to the named corpus
  step: 3
- id: rounds
  kind: activity
  lane: Scribe (tier 3)
  label: runs bounded research rounds for each brief
  step: 4
- id: candidates
  kind: activity
  lane: Core
  label: adds finds from the corpus only, read but unaccepted sources included and labelled
  step: 5
- id: propose
  kind: activity
  lane: Clerk (tier 2)
  label: proposes a decision for each run of candidates, with its reason
  step: 6
- id: decide
  kind: activity
  lane: Lead (tier 1)
  label: decides the candidates, each decision with its source and reason, or it is refused as incomplete
  step: 7
- id: dbudget
  kind: decision
  lane: Core
  label: is the work inside the envelope?
- id: scope
  kind: activity
  lane: Oracle
  label: judges whether the extra work serves the brief (an in-scope verdict allows only what the mandate permits)
- id: dscope
  kind: decision
  lane: Oracle
  label: in scope?
- id: allow
  kind: activity
  lane: Core
  label: records the allowance for the end-of-run report
- id: askonce
  kind: activity
  lane: Owner
  label: 'answers one consolidated question on the agenda: extend, narrow or stop; until then the session is parked at its
    resume point'
- id: downer
  kind: decision
  lane: Owner
  label: extends or narrows?
- id: ref_cite
  kind: ref
  lane: Lead (tier 1)
  use_case: cite-graph
  label: reads and cites the kept papers
  step: 8
- id: synth
  kind: activity
  lane: Lead (tier 1)
  label: records one synthesis per brief
  step: 9
- id: place
  kind: activity
  lane: Lead (tier 1)
  label: places each finding in our code as a claim citing a code entity
  step: 10
- id: draft
  kind: activity
  lane: Lead (tier 1)
  label: drafts one report per brief
  step: 11
- id: ref_verify
  kind: ref
  lane: Core
  use_case: verify-claims
  label: verifies and reviews every claim, code placements included
  step: 12
- id: ref_oracle
  kind: ref
  lane: Oracle
  use_case: oracle
  label: 'judges each report against its brief: question answered, corpus kept, disqualifiers held, gaps stated'
  step: 13
- id: dshort
  kind: decision
  lane: Lead (tier 1)
  label: is this the brief's first shortfall?
- id: record
  kind: activity
  lane: Core
  label: 'writes the run''s result record: answers, gaps, spend and allowances'
  step: 14
- id: handover
  kind: activity
  lane: Lead (tier 1)
  label: hands over the staged reports and the result record
  step: 15
- id: e1
  kind: end
  outcome: success
  label: one judged, staged report per question
- id: e_paused
  kind: end
  outcome: paused
  label: stopped by the Owner, or waiting on a held claim
- id: e_escalated
  kind: end
  outcome: escalated
  label: 'the graph is unavailable, or the Oracle escalates: tier 0 and the Owner are told'
