title: 'Context 2: External-Project Tier 0 Accesses Librarian via MCP (Proposed To-Be)'
problem:
  symptom: External project agents hit delegate contribute-tier blocks, Chat-tab Ask timeouts on MCP writes, conflated Context-1/3
    acceptance authority, and Applications logs missing authorship/repeatability provenance.
  root: Enforce explicit Context-2 authority boundaries (consult research delegation budget, S1-S6b source access, queue/stage_only
    intake, no vault acceptance, agent-authored & Core-stored Applications/) and dual project/Librarian notifications.
lanes:
- Clerk (tier 2)
- Doctor
- Core
- Overseer (tier 0)
- Owner
nodes:
- id: s
  kind: start
  label: start
- id: extgoal
  kind: activity
  lane: Owner
  step: 1
  label: tasks External Tier 0 with building or researching in an external project outside Librarian
- id: identifyneed
  kind: activity
  lane: Overseer (tier 0)
  step: 2
  label: frames external knowledge or parallel-read need; calls Librarian MCP (apply / explore / delegate)
- id: mcpenv
  kind: activity
  lane: Core
  step: 3
  label: records spec_owner=external_project_caller; enforces helper budget, S1-S6b, queue/stage_only, no vault accept
- id: dmode
  kind: decision
  lane: Core
  label: external-project MCP mode valid?
- id: mcpblocked
  kind: activity
  lane: Core
  label: returns fast structured PERMISSION_UNANSWERED/tier/scope Ticket instead of blind 150s UI hang
- id: notifyblocked
  kind: activity
  lane: Overseer (tier 0)
  label: reports exact Context-2 MCP authority/route gap & resume choice to external-project user
- id: userpause
  kind: activity
  lane: Owner
  label: receives paused external notice, Ticket ID, & Librarian Agenda resume link
- id: reusedapp
  kind: activity
  lane: Core
  label: confirms unchanged catalogued Sources & matching Applications/ precedent ($0 new spend)
- id: reuseext
  kind: activity
  lane: Overseer (tier 0)
  label: reuses verified precedent directly in external project
- id: parallelhelpers
  kind: activity
  lane: Clerk (tier 2)
  step: 4
  label: Lead sets narrowed helper sub-spec; Clerk/Scribe run DeepInfra delegate/dispatch_plan in budget
- id: checkcatalog
  kind: activity
  lane: Core
  step: 5
  label: 'returns verified catalogue citations, ref: handles, spend & checks unresolved external leads'
- id: dmissing
  kind: decision
  lane: Core
  label: catalogued Sources satisfy external need?
- id: queueasync
  kind: activity
  lane: Core
  label: enqueues unresolved_sources into .librarian/staging/source without hijacking external build
- id: ingestchild
  kind: ref
  lane: Core
  use_case: ingestion
  label: Lead runs narrowed L2 stage_only intake child (sub_spec_owner=lead_tier1 <= Context 2; no accept)
- id: dcrit_ex
  kind: decision
  lane: Core
  label: critical security/data-loss/boundary breach vs mapped shortfall?
- id: reuseingest
  kind: activity
  lane: Core
  label: reconciles reused source note & links candidate to active apply session
- id: applypartial
  kind: activity
  lane: Overseer (tier 0)
  label: applies held partial evidence in external project & records unresolved_sources leads + spend
- id: userpartial
  kind: activity
  lane: Owner
  label: receives external deliverable, coverage gaps, spend & queued Library Agenda leads
- id: queuepause
  kind: activity
  lane: Core
  label: keeps staged/enriched Source on Librarian Agenda for human/Context-1 acceptance; returns resume ref
- id: doctorex
  kind: ref
  lane: Doctor
  use_case: doctor
  label: attempts bounded MCP/intake Ticket repair (GLM-5.3 isolated adapter)
- id: reentryex
  kind: activity
  lane: Core
  label: confirms single-pass Doctor repair before retrying external lookup
- id: escticket
  kind: activity
  lane: Core
  label: routes critical escalated Ticket immediately with flags, evidence & Rule-8 compensation
- id: notifyesc
  kind: activity
  lane: Overseer (tier 0)
  label: alerts external-project user immediately with critical Ticket ID & retained evidence
- id: useresc
  kind: activity
  lane: Owner
  label: receives urgent external failure notice & Librarian Ticket link
- id: extapply
  kind: activity
  lane: Overseer (tier 0)
  step: 6
  label: applies verified findings in external project & submits authored Application proposal
- id: recordapp
  kind: activity
  lane: Core
  step: 7
  label: validates citations, stores append-only Applications/ + sidecar & auto-enqueues unresolved_sources
- id: userhandover
  kind: activity
  lane: Owner
  step: 8
  label: receives ext deliverable + locators, spend, Applications/ link & Agenda queued-lead receipt
- id: userreuse
  kind: activity
  lane: Owner
  label: receives reused Library precedent & unchanged Application link
- id: e1
  kind: end
  outcome: success
  label: external task completed with repeatable Applications/ precedent & queued leads
- id: epartial
  kind: end
  outcome: partial
  label: external task completed with partial/async-queued Library leads; user notified
- id: ereused
  kind: end
  outcome: reused
  label: existing Library precedent reused without re-ingestion
- id: epaused
  kind: end
  outcome: paused
  label: Librarian MCP grant/gate paused cleanly on Agenda; external user notified
- id: eescalated
  kind: end
  outcome: escalated
  label: critical Librarian MCP/intake Ticket escalated; user notified
