# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: activation-external-project
use_case: UC0
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-context2-external-project-mcp.spec.yaml
title: Work for an external project through MCP (proposed)
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/to-be/activation-external-project.spec.yaml
problem:
  symptom: 'As-is: delegation refused at the external project''s tier, permission asks timing out, acceptance authority confused
    with the other contexts, and Applications/ notes that record no authorship or locators.'
  root: 'An external project gets a scoped grant: a reading budget, checked third-party access, intake that only queues or
    stages, no acceptance, and Applications/ notes written by the agent and stored by the Core.'
lanes:
- Clerk (tier 2)
- Doctor
- Core
- Overseer (tier 0)
- Owner
nodes:
- id: s
  kind: start
  label: start
- id: extgoal
  kind: activity
  lane: Owner
  step: 1
  label: tasks External Tier 0 with building or researching in an external project outside Librarian
- id: identifyneed
  kind: activity
  lane: Overseer (tier 0)
  step: 2
  label: frames external knowledge or parallel-read need; calls Librarian MCP (apply / explore / delegate)
- id: mcpenv
  kind: activity
  lane: Core
  step: 3
  label: records the external project as the specification's owner, and enforces its helper budget, third-party checks and
    stage-only intake (no acceptance)
- id: dmode
  kind: decision
  lane: Core
  label: external-project MCP mode valid?
- id: mcpblocked
  kind: activity
  lane: Core
  label: returns a structured ticket at once (unanswered, tier or scope), not a 150-second wait
- id: notifyblocked
  kind: activity
  lane: Overseer (tier 0)
  label: tells the external project's user exactly what authority or route is missing, and how to resume
- id: userpause
  kind: activity
  lane: Owner
  label: receives the pause, its ticket and the agenda link to resume it
- id: reusedapp
  kind: activity
  lane: Core
  label: confirms the catalogued sources are unchanged and a matching Applications/ note exists, at no new spend
- id: reuseext
  kind: activity
  lane: Overseer (tier 0)
  label: reuses verified precedent directly in external project
- id: parallelhelpers
  kind: activity
  lane: Clerk (tier 2)
  step: 4
  label: 'runs the delegated reading within the helper budget: the Lead sets a narrower sub-task, Clerks and Scribes do it'
- id: checkcatalog
  kind: activity
  lane: Core
  step: 5
  label: returns the verified catalogue citations with their handles and the spend, and checks the unresolved leads
- id: dmissing
  kind: decision
  lane: Core
  label: catalogued Sources satisfy external need?
- id: queueasync
  kind: activity
  lane: Core
  label: queues the unresolved sources for the library's staging, without holding up the external work
- id: ingestchild
  kind: ref
  lane: Core
  use_case: ingestion
  label: stages the missing sources through a stage-only intake the Lead runs, narrower than the grant and with no acceptance
- id: dcrit_ex
  kind: decision
  lane: Core
  label: a critical security, data-loss or boundary breach, rather than a mapped shortfall?
- id: reuseingest
  kind: activity
  lane: Core
  label: reconciles the reused Source note and links the candidate to the open apply session
- id: applypartial
  kind: activity
  lane: Overseer (tier 0)
  label: applies the partial evidence it holds in the external project, and records the unresolved leads and spend
- id: userpartial
  kind: activity
  lane: Owner
  label: receives the external deliverable, its coverage gaps, the spend and the leads queued in the library
- id: queuepause
  kind: activity
  lane: Core
  label: keeps the staged sources on the library's agenda for a person, or tier 0, to accept; returns how to resume
- id: doctorex
  kind: ref
  lane: Doctor
  use_case: doctor
  label: attempts a bounded repair of the MCP or intake ticket
- id: reentryex
  kind: activity
  lane: Core
  label: confirms single-pass Doctor repair before retrying external lookup
- id: escticket
  kind: activity
  lane: Core
  label: routes the critical ticket at once, with its flags, evidence and the compensation shown
- id: notifyesc
  kind: activity
  lane: Overseer (tier 0)
  label: alerts the external project's user at once, with the ticket and the evidence kept
- id: useresc
  kind: activity
  lane: Owner
  label: receives the urgent failure notice and the ticket's link
- id: extapply
  kind: activity
  lane: Overseer (tier 0)
  step: 6
  label: applies the verified findings in the external project and proposes the Applications/ note it wrote
- id: recordapp
  kind: activity
  lane: Core
  step: 7
  label: validates the citations, stores the append-only Applications/ note with its locators, and queues the unresolved sources
- id: userhandover
  kind: activity
  lane: Owner
  step: 8
  label: receives the external deliverable with its locators, the spend, the Applications/ link and the queued leads
- id: userreuse
  kind: activity
  lane: Owner
  label: receives the library's reused precedent and the unchanged Applications/ link
- id: e1
  kind: end
  outcome: success
  label: the external task is done, with a repeatable Applications/ precedent and any queued leads
- id: epartial
  kind: end
  outcome: partial
  label: the external task is done with partial evidence; the leads are queued in the library and the user told
- id: ereused
  kind: end
  outcome: reused
  label: existing Library precedent reused without re-ingestion
- id: epaused
  kind: end
  outcome: paused
  label: the library's grant or gate paused cleanly on the agenda; the external user is told
- id: eescalated
  kind: end
  outcome: escalated
  label: a critical MCP or intake ticket escalated; the user is told
edges:
- from: s
  to: extgoal
- from: extgoal
  to: identifyneed
- from: identifyneed
  to: mcpenv
- from: mcpenv
  to: dmode
- from: dmode
  to: parallelhelpers
  guard: a session authorised to read, delegate and apply
- from: dmode
  to: mcpblocked
  guard: ungranted write or missing MCP route
  ext: 3a
- from: dmode
  to: reusedapp
  guard: the sources are unchanged and an Applications/ precedent exists
  ext: 3b
- from: mcpblocked
  to: notifyblocked
- from: notifyblocked
  to: userpause
- from: userpause
  to: epaused
- from: reusedapp
  to: reuseext
- from: reuseext
  to: userreuse
- from: userreuse
  to: ereused
- from: parallelhelpers
  to: checkcatalog
- from: checkcatalog
  to: dmissing
- from: dmissing
  to: extapply
  guard: held Sources satisfy external project
- from: dmissing
  to: queueasync
  guard: 'missing sources: queue them for later (the default for an external project)'
  ext: 5a
- from: dmissing
  to: ingestchild
  guard: missing sources, and the grant allows staging them
  ext: 5b
- from: queueasync
  to: applypartial
- from: applypartial
  to: userpartial
- from: userpartial
  to: epartial
- from: ingestchild
  to: extapply
  guard: success
- from: ingestchild
  to: applypartial
  guard: partial
- from: ingestchild
  to: reuseingest
  guard: reused
- from: reuseingest
  to: extapply
- from: ingestchild
  to: queuepause
  guard: paused
- from: queuepause
  to: userpause
- from: ingestchild
  to: dcrit_ex
  guard: escalated
- from: dcrit_ex
  to: escticket
  guard: critical security, data-loss, or boundary violation
- from: dcrit_ex
  to: doctorex
  guard: mapped noncritical shortfall
- from: doctorex
  to: reentryex
  guard: resolved
- from: reentryex
  to: checkcatalog
- from: doctorex
  to: queuepause
  guard: declined
- from: doctorex
  to: escticket
  guard: escalated
- from: escticket
  to: notifyesc
- from: notifyesc
  to: useresc
- from: useresc
  to: eescalated
- from: extapply
  to: recordapp
- from: recordapp
  to: userhandover
- from: userhandover
  to: e1
