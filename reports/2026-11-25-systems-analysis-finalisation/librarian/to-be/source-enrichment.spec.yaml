# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: source-enrichment
use_case: UC1c
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-source-enrichment-tobe.spec.yaml
- reports/2026-11-21-enrichment-baseline/enrichment-cycle.spec.yaml
- reports/2026-11-22-proposed-tobe-enrichment/proposed-tobe-enrichment.spec.yaml
- reports/2026-11-23-proposed-process-family/proposed-source-enrichment.spec.yaml
title: Enrich one source (proposed)
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/to-be/source-enrichment.spec.yaml
problem:
  symptom: 'As-is: part counts hid failed whole-source passes, budget checks only before each item let inner calls leak, and
    papers with no claims passed silently.'
  root: Record what started the work, reuse what is already done, reserve the budget before each dispatch, check the whole-source
    derivations, quarantine poison text, require claims from Geo-Grapher, and never block mid-loop on the Owner.
lanes:
- Oracle
- Lead (tier 1)
- Doctor
- Core
nodes:
- id: s
  kind: start
  label: start
- id: bind
  kind: activity
  lane: Core
  label: binds the source and its workflow's mandate (never wider than the parent), and the receipts of work already done
  step: 1
- id: dwork
  kind: decision
  lane: Core
  label: what admitted this source's workflow?
- id: userread
  kind: activity
  lane: Core
  label: admits the person's reread from the Web UI, under their workflow grant
- id: t0read
  kind: activity
  lane: Core
  label: verifies the commission's envelope for this source (tier 0, or an external project)
- id: controls
  kind: activity
  lane: Core
  label: checks cancellation and the lease, and reserves the budget before dispatching
  step: 2
- id: dcontrols
  kind: decision
  lane: Core
  label: controls permit dispatch?
- id: ref_source_parse
  kind: ref
  lane: Core
  use_case: source-parse
  label: validates and parses the source
  step: 3
- id: ref_source_reading
  kind: ref
  lane: Core
  use_case: source-reading
  label: plans, reads and checks the source
  step: 4
- id: quarantine
  kind: activity
  lane: Core
  label: quarantines the poison item and drops its provisional cache
- id: ref_paper_publication
  kind: ref
  lane: Core
  use_case: paper-publication
  label: publishes the paper to the paper graph
  step: 5
- id: pubna
  kind: activity
  lane: Core
  label: 'records publication as not applicable: not a PDF, or no full conversion'
- id: pubgap
  kind: activity
  lane: Core
  label: records an empty paper graph or a refusal, without closing the requirement
- id: oracle
  kind: activity
  lane: Oracle
  label: audits the raw receipts, the spend and the fidelity of what was read, on a route distinct from the workers'
  step: 6
- id: dverdict
  kind: decision
  lane: Oracle
  label: Source Oracle verdict?
- id: doctor
  kind: ref
  lane: Doctor
  use_case: doctor
  label: runs the accepted remedy for the ticket
- id: reentry
  kind: activity
  lane: Core
  label: checks the single repair and re-admits the source
- id: handback
  kind: activity
  lane: Lead (tier 1)
  label: returns the verified source, its costs, coverage and the separate worklists to the batch
  step: 7
- id: retpartial
  kind: activity
  lane: Lead (tier 1)
  label: returns the non-critical partial source, with its unmet tasks and any quarantine stated
- id: retpause
  kind: activity
  lane: Lead (tier 1)
  label: 'returns the pause: the budget ceiling, cancellation, or no Oracle route distinct from the workers'' (never marked
    as independently reviewed)'
- id: retesc
  kind: activity
  lane: Lead (tier 1)
  label: escalates critical integrity or authority-boundary fault to invoking parent
- id: e1
  kind: end
  outcome: success
  label: the source meets its reading and publication obligations
- id: epartial
  kind: end
  outcome: partial
  label: partial or quarantined Source returned; gap explicit
- id: enowork
  kind: end
  outcome: reused
  label: nothing new admitted; the existing receipts are reused
- id: epaused
  kind: end
  outcome: paused
  label: 'paused: cancelled, the budget reached, or no distinct Oracle route'
- id: eescalated
  kind: end
  outcome: escalated
  label: critical or unresolved integrity fault escalated
edges:
- from: s
  to: bind
- from: bind
  to: dwork
- from: dwork
  to: controls
  guard: system triggered (batch item admitted)
- from: dwork
  to: userread
  guard: the person asked for it (a reread or a revision)
  ext: 2a
- from: dwork
  to: t0read
  guard: tier 0 directed (external grant verified)
  ext: 2b
- from: dwork
  to: enowork
  guard: none admitted / reused
  ext: 2c
- from: userread
  to: controls
- from: t0read
  to: controls
- from: controls
  to: dcontrols
- from: dcontrols
  to: ref_source_parse
  guard: the controls allow it and the budget is reserved
- from: dcontrols
  to: retpause
  guard: paused, or the budget is reached
  ext: 3a
- from: dcontrols
  to: retesc
  guard: critical writer or lease fault
  ext: 3b
- from: quarantine
  to: retpartial
- from: pubna
  to: oracle
- from: pubgap
  to: oracle
- from: oracle
  to: dverdict
- from: dverdict
  to: handback
  guard: all obligations met (distinct Oracle route)
- from: dverdict
  to: doctor
  guard: mapped shortfall needs bounded repair
  ext: 7a
- from: dverdict
  to: retpartial
  guard: permitted partial gap
  ext: 7b
- from: dverdict
  to: retesc
  guard: critical finding
  ext: 7c
- from: dverdict
  to: retpause
  guard: no Oracle route distinct from the workers' (never marked as independently reviewed)
  ext: 7d
- from: doctor
  to: reentry
  guard: resolved
- from: reentry
  to: ref_source_parse
- from: doctor
  to: retpartial
  guard: declined
- from: doctor
  to: retesc
  guard: escalated
- from: handback
  to: e1
- from: retpartial
  to: epartial
- from: retpause
  to: epaused
- from: retesc
  to: eescalated
- from: ref_source_parse
  to: ref_source_reading
  guard: success
- from: ref_source_parse
  to: quarantine
  guard: failed
  ext: 3c
- from: ref_source_reading
  to: ref_paper_publication
  guard: success
- from: ref_source_reading
  to: quarantine
  guard: failed
  ext: 4a
- from: ref_paper_publication
  to: oracle
  guard: success
- from: ref_paper_publication
  to: pubna
  guard: not applicable
  ext: 5a
- from: ref_paper_publication
  to: pubgap
  guard: gap
  ext: 5b
