# UC4 to-be: a paper is cited through the link stored when it was published (AS-IS-FINDINGS T8).
diagram: cite-graph
use_case: UC4
status: PROPOSED_UNACCEPTED
supersedes: []
kind: activity
title: Read and cite a paper from the graph (proposed)
problem:
  symptom: "As-is: paper and note joined by title; a read but unaccepted paper could not be quoted."
  root: "Publication stores the paper's link to its staged item and, later, its note; a citation follows the stored link."
lanes: [Lead (tier 1), Core, Geo-Grapher]
nodes:
  - {id: s, kind: start, label: start}
  - {id: search, kind: activity, lane: Geo-Grapher, step: 1, label: "answers a search of the library's paper graph (labels in the Lead's context)"}
  - {id: outline, kind: activity, lane: Geo-Grapher, step: 2, label: "returns the paper's outline"}
  - {id: sections, kind: activity, lane: Lead (tier 1), step: 3, label: "reads the methods and results sections"}
  - {id: put, kind: activity, lane: Lead (tier 1), step: 4, label: "puts the paper forward by its citation handle"}
  - {id: dconnected, kind: decision, lane: Core, label: "is the library's Geo-Grapher connected?"}
  - {id: resolve, kind: activity, lane: Core, step: 5, label: "follows the paper's stored link to its Source note, or to its staged item"}
  - {id: dlink, kind: decision, lane: Core, label: "where does the link lead?"}
  - {id: staged, kind: activity, lane: Core, label: "allows a quote from the staged evidence, labelled as an unaccepted source"}
  - {id: ticket, kind: activity, lane: Core, label: "opens a ticket: a published paper with no stored link"}
  - {id: cite, kind: activity, lane: Lead (tier 1), step: 6, label: "cites the paper with a quote from what the link resolved to"}
  - {id: e1, kind: end, outcome: success, label: "the paper is cited through its stored link"}
  - {id: e_unavailable, kind: end, outcome: unavailable, label: "no graph, or no link: the handle is refused"}
edges:
  - {from: s, to: search}
  - {from: search, to: outline}
  - {from: outline, to: sections}
  - {from: sections, to: put}
  - {from: put, to: dconnected}
  - {from: dconnected, to: resolve, guard: "yes"}
  - {from: dconnected, to: e_unavailable, guard: "no", ext: 5a}
  - {from: resolve, to: dlink}
  - {from: dlink, to: cite, guard: an accepted Source note}
  - {from: dlink, to: staged, guard: "a staged item, read but not accepted", ext: 5b}
  - {from: dlink, to: ticket, guard: nowhere, ext: 5c}
  - {from: staged, to: cite}
  - {from: ticket, to: e_unavailable}
  - {from: cite, to: e1}
evidence:
  - "AS-IS-FINDINGS.md T8; as-is cite-graph 6b and the title assumption in USE-CASES.md UC4."
