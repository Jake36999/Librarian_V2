- from: reentryfinal
  to: oraclefinal
- from: doctorphase
  to: pauseout
  guard: declined
- from: doctorphase
  to: escout
  guard: escalated
- from: doracle
  to: pauseout
  guard: unmapped gap requires Owner decision
  ext: 11b
- from: doracle
  to: pauseout
  guard: no Oracle route distinct from the workers' (never marked as independently reviewed)
  ext: 11c
- from: doracle
  to: escout
  guard: critical integrity or authority-boundary finding
  ext: 11d
- from: deliver
  to: dfinalkind
- from: dfinalkind
  to: recorddelivery
  guard: everything required and optional is clean
- from: dfinalkind
  to: recordpartial
  guard: permitted partial coverage or deferred lenses
  ext: 12a
- from: recorddelivery
  to: notifyowner
- from: notifyowner
