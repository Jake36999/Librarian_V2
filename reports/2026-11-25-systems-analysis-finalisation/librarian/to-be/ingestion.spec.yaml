# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: ingestion
use_case: UC1
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-ingestion-tobe.spec.yaml
- reports/2026-11-20-workflow-map/examples/ingestion/ingestion-tobe.spec.yaml
- reports/2026-11-23-proposed-process-family/proposed-ingestion.spec.yaml
title: Make a folder of documents into Source notes (proposed)
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/to-be/ingestion.spec.yaml
problem:
  symptom: The earlier draft hid three different callers behind one trigger, gave the Owner seven main-path steps and three
    serial acceptance prompts, could block an external tier 0 at curate, and skipped the final Oracle check on code-only folders.
  root: Take a mandate from any caller that never widens its parent; delegate routine screening and acceptance to the Lead,
    the Oracle and the Doctor; consolidate acceptance into one decision; end with one of five outcomes and its tickets.
lanes:
- Owner
- Lead (tier 1)
- Doctor
- Oracle
- Core
nodes:
- id: s
  kind: start
  label: start
- id: admit_mandate
  kind: activity
  lane: Core
  label: admits the ingestion's mandate, its owner, budget and who commissioned it; it never widens its parent
  step: 1
- id: leadbind
  kind: activity
  lane: Lead (tier 1)
  label: owns the ingestion run and its permission envelope, never wider than the parent
  step: 2
- id: ref_folder_review
  kind: ref
  lane: Core
  use_case: folder-review
  label: surveys, screens and applies the folder's own group
  step: 3
- id: queueagenda
  kind: activity
  lane: Core
  label: puts the reserved decision, or the external project's hold, on the agenda as a ticket without blocking the caller
- id: dinput
  kind: decision
  lane: Core
  label: Source-eligible files or queued refs in scope?
- id: ref_source_intake
  kind: ref
  lane: Core
  use_case: source-intake
  label: captures, titles and stages each source
  step: 4
- id: dgate1
  kind: decision
  lane: Core
  label: are approving and starting the batch within the mandate?
- id: dgate1caller
  kind: decision
  lane: Core
  label: interactive Specification owner present?
- id: ownergate1
  kind: decision
  lane: Owner
  label: approve and start the batch?
- id: startrun
  kind: activity
  lane: Core
  label: checks the Lead's approval against the grant and the run's checkpoint, and freezes the mixed batch
  step: 5
- id: batch
  kind: ref
  lane: Core
  use_case: batch-enrichment
  label: runs the mixed batch of sources and folder cards against the frozen ledger
  step: 6
- id: ledger
  kind: activity
  lane: Core
  label: reconciles one paged ledger for the folder, and separates the folder, source, lens, topic and bridge lists
  step: 7
- id: oraclebatch
  kind: activity
  lane: Oracle
  label: screens the batch's outputs, partial gaps and Geo-Grapher receipts on a route distinct from the workers'
  step: 8
- id: dbatchscreen
  kind: decision
  lane: Oracle
  label: pre-promotion batch quality?
- id: doctorbatch
  kind: ref
  lane: Doctor
  use_case: doctor
  label: repairs the partial or unpublished items through a ticket, on the affected subset only
- id: reentrybatch
  kind: activity
  lane: Core
  label: merges the checked repair into the ledger (one attempt)
- id: ref_acceptance
  kind: ref
  lane: Lead (tier 1)
  use_case: acceptance
  label: accepts the screened sources within the mandate, or asks the Owner once
  step: 9
- id: oraclefinal
  kind: activity
  lane: Oracle
  label: verifies findability, neutrality and the ledger on a route distinct from the workers'
  step: 10
- id: doracle
  kind: decision
  lane: Oracle
  label: are the parent's obligations and findability met?
- id: doctorphase
  kind: ref
  lane: Doctor
  use_case: doctor
  label: repairs findability, or another mapped shortfall, through a ticket
- id: reentryfinal
  kind: activity
  lane: Core
  label: confirms single-pass post-promotion repair
- id: deliver
  kind: activity
  lane: Lead (tier 1)
  label: packages the Oracle's verdict, evidence hashes, spend, coverage, deferred decisions and tickets
  step: 11
- id: dfinalkind
  kind: decision
  lane: Core
  label: full obligations clean vs permitted partial?
- id: recorddelivery
  kind: activity
  lane: Core
  label: 'stores the final receipt: spend, coverage, deferrals and the handover'
  step: 12
- id: notifyowner
  kind: activity
  lane: Owner
  label: 'receives the verified result: the catalogued notes, the spend and the deferred work'
  step: 13
- id: recordpartial
  kind: activity
  lane: Core
  label: stores the partial coverage, spend, deferred items and open tickets
- id: notifypartial
  kind: activity
  lane: Owner
  label: receives the partial result, what was not examined, the spend and the tickets to resume
- id: reuseout
  kind: activity
  lane: Core
  label: reconciles the reused and excluded inputs, with no batch dispatched and nothing spent
- id: pauseout
  kind: activity
  lane: Lead (tier 1)
  label: returns the held gate, a route-collision ticket or a refusal, with the spend and where to resume
- id: escout
  kind: activity
  lane: Lead (tier 1)
  label: routes the critical or unresolved ticket at once, with its flags, hashes and the compensation shown
- id: e1
  kind: end
  outcome: success
  label: parent receives Oracle-verified full catalogue state; notification recorded
- id: epartial
  kind: end
  outcome: partial
  label: a permitted partial, or a deferred worklist, returned with its gaps and tickets
- id: ereused
  kind: end
  outcome: reused
  label: the existing and excluded inputs reconciled cleanly
- id: epaused
  kind: end
  outcome: paused
  label: 'paused: a reserved decision, stage-only scope, the budget, or no distinct Oracle route'
- id: eescalated
  kind: end
  outcome: escalated
  label: an unresolved critical integrity ticket escalated
edges:
- from: s
  to: admit_mandate
- from: admit_mandate
  to: leadbind
- from: leadbind
  to: ref_folder_review
- from: dinput
  to: ref_source_intake
  guard: Source-eligible inputs present
- from: dinput
  to: oraclefinal
  guard: code or graph folders only (no Source notes)
  ext: 4a
- from: dinput
  to: reuseout
  guard: all inputs already current or excluded
  ext: 4b
- from: dgate1
  to: startrun
  guard: within tier 0's commission, or the person's own start
- from: dgate1
  to: dgate1caller
  guard: an external project's stage-only scope, or waiting for the person's start
  ext: 5a
- from: dgate1caller
  to: ownergate1
  guard: the Owner is present, in the Web UI
- from: dgate1caller
  to: queueagenda
  guard: no person present (an external project or a scheduled run)
- from: ownergate1
  to: startrun
  guard: approve and start
- from: ownergate1
  to: pauseout
  guard: stage only / defer
- from: startrun
  to: batch
- from: batch
  to: ledger
  guard: success
- from: batch
  to: ledger
  guard: partial
  ext: 6a
- from: batch
  to: reuseout
  guard: reused
  ext: 6b
- from: batch
  to: pauseout
  guard: paused
  ext: 6c
- from: batch
  to: escout
  guard: escalated
  ext: 6d
- from: ledger
  to: oraclebatch
- from: oraclebatch
  to: dbatchscreen
- from: dbatchscreen
  to: ref_acceptance
  guard: ready for acceptance routing (distinct Oracle route pass)
- from: dbatchscreen
  to: doctorbatch
  guard: repairable partial or publish gap (R4)
  ext: 9a
- from: doctorbatch
  to: reentrybatch
  guard: resolved
- from: reentrybatch
  to: ref_acceptance
- from: doctorbatch
  to: ref_acceptance
  guard: declined
- from: doctorbatch
  to: escout
  guard: escalated
- from: dbatchscreen
  to: pauseout
  guard: unmet required output blocks promotion
  ext: 9b
- from: dbatchscreen
  to: pauseout
