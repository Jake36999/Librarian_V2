# Owner decision and closing fixes by tools/s7_owner_decisions.py (2026-11-26).
diagram: source-reading
use_case: UC1c.2
status: PROPOSED_UNACCEPTED
kind: activity
title: Read one source (proposed)
lanes:
- Clerk (tier 2)
- Scribe (tier 3)
- Core
- Model host
nodes:
- id: s
  kind: start
  label: start
- id: readplan
  kind: activity
  lane: Clerk (tier 2)
  label: assigns spread chunks, blind lens tasks, and required whole-source passes
  step: 1
- id: read
  kind: activity
  lane: Scribe (tier 3)
  label: carries out bounded reading and synthesis tasks, at most a set number at a time within the stage, within the reserved
    budget
  step: 2
- id: host
  kind: activity
  lane: Model host
  label: answers the task requests on the qualified route, never another model in its place, and settles the reserved cost
    against the actual
  step: 3
- id: readchk
  kind: activity
  lane: Core
  label: verifies each part's schema and quotes, and keeps part reading apart from the whole-source pass
  step: 4
- id: readproof
  kind: activity
  lane: Clerk (tier 2)
  label: reconciles the whole-source pass and the chapter relations
  step: 5
- id: dread
  kind: decision
  lane: Core
  label: are the part readings and the whole-source derivations complete?
- id: dpoison
  kind: decision
  lane: Core
  label: what is left after the bounded retries (at most two per part; the number is a decision)?
- id: partialread
  kind: activity
  lane: Core
  label: keeps the item partial, with its unread parts or missing whole-source pass stated
- id: lenses
  kind: activity
  lane: Core
  label: stores the grounded lens candidates, read blind; accepting them is a separate decision
  step: 6
- id: data
  kind: activity
  lane: Core
  label: extracts the structural Data records and the static code relations by script, at no cost
  step: 7
- id: drelate
  kind: decision
  lane: Core
  label: multi-chapter document needing semantic relations?
- id: relateskip
  kind: activity
  lane: Core
  label: keeps the Core's static code relations, or records chapter relations as not applicable
- id: relate
  kind: activity
  lane: Clerk (tier 2)
  label: proposes semantic chapter relations across read chapters (Core persists)
  step: 8
- id: metapropose
  kind: activity
  lane: Clerk (tier 2)
  label: proposes semantic content-model metadata fields from evidence; retains Unknown where insufficient
  step: 9
- id: metadata
  kind: activity
  lane: Core
  label: derives the deterministic facts, validates the proposed fields against the schema, and stores them with the unknowns
  step: 10
- id: review
  kind: activity
  lane: Clerk (tier 2)
  label: drafts a neutral Bottom Line and the sensitivity check, flagging low confidence
  step: 11
- id: reviewchk
  kind: activity
  lane: Core
  label: checks the Bottom Line's form, its quotes and the reading counters; a good draft never overrides incomplete reading
  step: 12
- id: e_success
  kind: end
  outcome: success
  label: read, each part checked
- id: e_failed
  kind: end
  outcome: failed
  label: poison or ungrounded text after bounded retries
edges:
- from: s
  to: readplan
- from: readplan
  to: read
- from: read
  to: host
- from: host
  to: readchk
- from: readchk
  to: readproof
- from: readproof
  to: dread
- from: dread
  to: lenses
  guard: every part and the whole-source pass are complete
- from: dread
  to: dpoison
  guard: unread parts or missing synthesis pass
  ext: 6a
- from: dpoison
  to: e_failed
  guard: the retries are spent, and the text is still ungrounded or poison
- from: dpoison
  to: partialread
  guard: noncritical partial retained
- from: partialread
  to: lenses
- from: lenses
  to: data
- from: data
  to: drelate
- from: drelate
  to: relate
  guard: 2+ read chapters with claims
- from: drelate
  to: relateskip
  guard: code repo (AST in Core Data) or <2 chapters
  ext: 8a
- from: relate
  to: metapropose
- from: relateskip
  to: metapropose
- from: metapropose
  to: metadata
- from: metadata
  to: review
- from: review
  to: reviewchk
- from: reviewchk
  to: e_success
- from: dpoison
  to: read
  guard: 'retries left: re-read only the failed parts'
