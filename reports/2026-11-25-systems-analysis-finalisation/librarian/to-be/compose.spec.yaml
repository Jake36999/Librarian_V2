# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: compose
use_case: UC8
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-process-composition-tobe.spec.yaml
- reports/2026-11-20-workflow-map/examples/ingestion/compose.spec.yaml
kind: activity
title: Compose and start a sprint (proposed)
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/to-be/compose.spec.yaml
problem:
  symptom: The earlier model used the composition layers as swim lanes, and left out who owns each specification, the Oracle's
    scope judgment and the handovers to the person.
  root: Compose strictly action, workflow, pipeline, sprint across the real actors; name each specification's owner; keep
    every sub-run within its parent; let the Oracle judge scope; hand over to the person.
lanes:
- Owner
- Overseer (tier 0)
- Clerk (tier 2)
- Oracle
- Lead (tier 1)
- Core
nodes:
- id: s
  kind: start
  label: start
- id: init
  kind: activity
  lane: Owner
  step: 1
  label: starts work as tier 0's instruction, an external project over MCP, or directly in the Web UI
- id: dspec_owner
  kind: decision
  lane: Core
  label: who owns the sprint's specification?
- id: t0_spec
  kind: activity
  lane: Overseer (tier 0)
  step: 2
  label: writes the sprint's specification on the Owner's behalf and approves its permission envelope
- id: c2_spec
  kind: activity
  lane: Overseer (tier 0)
  label: sets the external project's specification within its bounded read-and-apply grant
- id: c3_spec
  kind: activity
  lane: Owner
  label: sets the specification of the person's own Web UI work, with no tier 0
- id: compile_manifest
  kind: activity
  lane: Core
  step: 3
  label: checks the order action, workflow, pipeline, sprint has no cycle, and compiles the manifest and the permission envelope
- id: lead_subspec
  kind: activity
  lane: Lead (tier 1)
  step: 4
  label: writes the delegated pipeline and workflow specifications, only within the parent's mandate
- id: dnarrow
  kind: decision
  lane: Core
  label: does the sub-run's manifest stay within its parent's mandate, reserved decisions included?
- id: oracle_scope
  kind: activity
  lane: Oracle
  label: judges an ungranted call against the sprint's specification before anyone is asked
- id: dscope
  kind: decision
  lane: Oracle
  label: is it within the specification and the parent's mandate?
- id: log_allowance
  kind: activity
  lane: Core
  label: records the allowance and its evidence for the end-of-run report
- id: worker_roles
  kind: activity
  lane: Clerk (tier 2)
  step: 5
  label: carries out the assigned interpretation, review and bounded reading and writing over the Core's scripted actions
- id: dctx
  kind: decision
  lane: Core
  label: which context runs the sprint?
- id: ctx1
  kind: ref
  lane: Lead (tier 1)
  step: 6
  use_case: activation-overseer
  label: 'tier 0''s sprint: the Lead runs the ingestion'
- id: ctx2
  kind: ref
  lane: Lead (tier 1)
  use_case: activation-external-project
  label: 'runs the external project''s sprint: delegated reading and applying, optionally staging'
- id: ctx3
  kind: ref
  lane: Lead (tier 1)
  use_case: activation-web-ui
  label: 'runs the person''s Web UI sprint: curation, then the batch or the ingestion, with no tier 0'
- id: oracle_rollup
  kind: activity
  lane: Oracle
  step: 7
  label: verifies the rolled-up obligations of every layer and the allowances made, on a route distinct from the workers'
- id: dor_comp
  kind: decision
  lane: Oracle
  label: are the composed obligations met?
- id: rollreceipt
  kind: activity
  lane: Core
  step: 8
  label: 'stores the run''s receipt: provenance at every layer, spend, coverage, deferrals, tickets and agenda'
- id: usernotify
  kind: activity
  lane: Owner
  step: 9
  label: 'receives the handover: the result''s evidence, spend, coverage and deferred work'
- id: outpartial
  kind: activity
  lane: Core
  label: stores the partial outputs, spend, coverage gaps and open tickets
- id: userpartial
  kind: activity
  lane: Owner
  label: receives the permitted partial report, what was not examined, the spend and the open tickets
- id: outreused
  kind: activity
  lane: Core
  label: stores the reuse receipt and the links to the existing precedent, with no work redone
- id: userreused
  kind: activity
  lane: Owner
  label: receives confirmation of reused catalogue state or Applications/ precedent
- id: outpause
  kind: activity
  lane: Core
  label: 'stores the pause as a ticket with where to resume: a reserved decision, the budget, or no distinct Oracle route'
- id: userpaused
  kind: activity
  lane: Owner
  label: receives the paused ticket, the spend and state so far, and where to resume
- id: outesc
  kind: activity
  lane: Core
  label: routes the critical ticket at once, with its full trace and the compensation shown
- id: useresc
  kind: activity
  lane: Owner
  label: receives the critical failure alert, the ticket and the compensation plan
- id: e1
  kind: end
  outcome: success
  label: the composition is done, every sub-run within its parent, and the person is told
- id: epartial
  kind: end
  outcome: partial
  label: done with permitted partials; the open tickets are reported
- id: ereused
  kind: end
  outcome: reused
  label: nothing new needed at any layer, with no duplicate spend
- id: epaused
  kind: end
  outcome: paused
  label: paused cleanly on a reserved decision, the budget or a route collision
- id: eescalated
  kind: end
  outcome: escalated
  label: a critical or unresolved ticket escalated at once to the person and the specification's owner
edges:
- from: s
  to: init
- from: init
  to: dspec_owner
- from: dspec_owner
  to: t0_spec
  guard: tier 0, working for the Owner
- from: dspec_owner
  to: c2_spec
  guard: tier 0, working for an external project
  ext: 1a
- from: dspec_owner
  to: c3_spec
  guard: the person, in the Web UI
  ext: 1b
- from: t0_spec
  to: compile_manifest
- from: c2_spec
  to: compile_manifest
- from: c3_spec
  to: compile_manifest
- from: compile_manifest
  to: lead_subspec
- from: lead_subspec
  to: dnarrow
- from: dnarrow
  to: worker_roles
  guard: within parent mandate
- from: dnarrow
  to: oracle_scope
  guard: 'an ungranted call: the Oracle judges its scope'
  ext: 4a
- from: oracle_scope
  to: dscope
- from: dscope
  to: log_allowance
  guard: within the parent's mandate and the specification
- from: dscope
  to: outpause
  guard: it would widen the parent's mandate, or needs a reserved decision
- from: dscope
  to: outesc
  guard: a critical security or data-loss breach
- from: log_allowance
  to: worker_roles
- from: worker_roles
  to: dctx
- from: dctx
  to: ctx1
  guard: tier 0's commission
- from: dctx
  to: ctx2
  guard: an external project
  ext: 6a
- from: dctx
  to: ctx3
  guard: the Web UI
  ext: 6b
- from: ctx1
  to: oracle_rollup
  guard: success
- from: ctx1
  to: outpartial
  guard: partial
  ext: 6c
- from: ctx1
  to: outreused
  guard: reused
  ext: 6d
- from: ctx1
  to: outpause
  guard: paused
  ext: 6e
- from: ctx1
  to: outesc
  guard: escalated
  ext: 6f
- from: ctx2
  to: oracle_rollup
  guard: success
- from: ctx2
  to: outpartial
  guard: partial
- from: ctx2
  to: outreused
  guard: reused
- from: ctx2
  to: outpause
  guard: paused
- from: ctx2
  to: outesc
  guard: escalated
- from: ctx3
  to: oracle_rollup
  guard: success
- from: ctx3
  to: outpartial
  guard: partial
- from: ctx3
  to: outreused
  guard: reused
- from: ctx3
  to: outpause
  guard: paused
- from: ctx3
  to: outesc
  guard: escalated
- from: oracle_rollup
  to: dor_comp
- from: dor_comp
  to: rollreceipt
  guard: obligations met (distinct Oracle route pass)
- from: dor_comp
  to: outpause
  guard: no Oracle route distinct from the workers' (never marked as independently reviewed)
  ext: 7a
- from: dor_comp
  to: outesc
  guard: a critical integrity finding at any layer
  ext: 7b
- from: rollreceipt
  to: usernotify
- from: usernotify
  to: e1
- from: outpartial
  to: userpartial
- from: userpartial
  to: epartial
- from: outreused
  to: userreused
- from: userreused
  to: ereused
- from: outpause
  to: userpaused
- from: userpaused
  to: epaused
- from: outesc
  to: useresc
- from: useresc
  to: eescalated
