entities:
- id: staged-item
  name: A staged item (a source)
  about: As today, plus an owner and a deadline for every waiting decision, and an Oracle check before acceptance.
  evidence: As-is states.yaml; AS-IS-FINDINGS T3, T5, T10
  initial: queued
  final:
  - accepted
  - rejected
  transitions:
  - from: queued
    to: staged
    true: the parent starts intake itself
    by: Core
  - from: staged
    to: approved
    true: Gate 1, within the mandate, or the Owner
    by: Lead (tier 1)
  - from: approved
    to: processing
    true: the parent's batch starts
    by: Core
  - from: processing
    to: enriched
    true: every stage done and checked
    by: Core
  - from: processing
    to: partial
    true: a stage partial; a ticket is open
    by: Core
  - from: partial
    to: processing
    true: the Doctor's remedy re-runs the affected stages
    by: Doctor
  - from: enriched
    to: judged
    true: the Oracle's verdict passes
    by: Oracle
  - from: partial
    to: judged
    true: the Oracle accepts the permitted partial
    by: Oracle
  - from: judged
    to: accepted
    true: accepted within the mandate, or in the Owner's one consolidated decision
    by: Lead (tier 1)
  - from: staged
    to: accepted
    true: 'accept as captured: the person''s explicit choice, coverage shown'
    by: Owner
  - from: judged
    to: deferred
    true: deferred, with an owner and a date
    by: Owner
  - from: staged
    to: rejected
    true: reject
    by: Owner
- id: folder-card
  name: A folder card
  about: 'One meaning per state: a card is selected for the batch, or decided and applied as its own group.'
  evidence: As-is states.yaml; AS-IS-FINDINGS T7, T10
  initial: staged
  final:
  - decided
  transitions:
  - from: staged
    to: screened
    true: a Clerk screens purpose, licence risk and sensitivity
    by: Clerk (tier 2)
  - from: screened
    to: decided
    true: within the commission or standing policy
    by: Lead (tier 1)
  - from: screened
    to: decided
    true: a reserved choice, in the Owner's consolidated decision
    by: Owner
  - from: decided
    to: decided
    true: Geo-Grapher applies this card's group only
    by: Geo-Grapher
  - from: decided
    to: staged
    true: 'its own root changed: re-surveyed in its own scope'
    by: Doctor
- id: session
  name: A session
  about: 'A brief''s session: its budget comes from the envelope, and a park has an owner.'
  evidence: As-is states.yaml; AS-IS-FINDINGS T2, T9
  initial: open
  final:
  - closed
  transitions:
  - from: open
    to: open
    true: next phase, within the envelope
    by: Lead (tier 1)
  - from: open
    to: open
    true: extra work judged in scope by the Oracle
    by: Oracle
  - from: open
    to: parked
    true: a reserved decision, on the agenda with its owner
    by: Core
  - from: parked
    to: open
    true: the decision is made
    by: Owner
  - from: open
    to: closed
    true: the Oracle's verdict is recorded and the handover made
    by: Lead (tier 1)
- id: offering
  name: An offering (a drafted report)
  about: Staged only with every claim found, reviewed and its verdict complete.
  evidence: As-is states.yaml; to-be verify-claims
  initial: draft
  final:
  - accepted
  - rejected
  transitions:
  - from: draft
    to: staged
    true: every claim found and reviewed
    by: Core
  - from: draft
    to: held
    true: a review could not complete on two routes
    by: Core
  - from: held
    to: draft
    true: the claim is rewritten or dropped
    by: Lead (tier 1)
  - from: staged
    to: judged
    true: the Oracle judges it against its brief
    by: Oracle
  - from: judged
    to: accepted
    true: promote
    by: Owner
  - from: judged
    to: rejected
    true: reject
    by: Owner
- id: ticket
  name: A fault ticket (new)
  about: One tracked failure, from its extension point to a checked repair or a recorded decision.
  evidence: docs/terminology.md (fault register, fault ticket); to-be doctor
  initial: open
  final:
  - resolved
  - declined
  - escalated
  transitions:
  - from: open
    to: assigned
    true: an accepted remedy matches its extension and symptom
    by: Core
  - from: open
    to: escalated
    true: 'no remedy matches: tier 0 gets it with the Clerk''s diagnosis'
    by: Core
  - from: assigned
    to: repairing
    true: the blast radius is within the mandate
    by: Core
  - from: assigned
    to: waiting
    true: the radius needs the Owner
    by: Core
  - from: waiting
    to: repairing
    true: scope granted
    by: Owner
  - from: waiting
    to: declined
    true: scope refused
    by: Owner
  - from: repairing
    to: checking
    true: the remedy ran
    by: Doctor
  - from: checking
    to: resolved
    true: the deterministic checks and the Oracle pass
    by: Oracle
  - from: checking
    to: escalated
    true: the repair did not hold
    by: Oracle
  - from: assigned
    to: assigned
    'on': 'past its review date: raised to the next owner (the Lead, then tier 0, then the Owner)'
    by: Core
- id: accepted-note
  name: An accepted Source note and its revisions
  about: 'A later reading never overwrites an accepted note: it stages a revision, which is accepted into the same note or
    rejected.'
  evidence: staging.py revision_of and merged (as-is accept of a revision, line 1152); 2026-11-21 baseline requirement of
    accepted-note revisions
  initial: accepted
  final:
  - accepted
  transitions:
  - from: accepted
    to: revision-staged
    'on': a later reading stages a revision; the note is untouched
    by: Core
  - from: revision-staged
    to: accepted
    'on': the revision is accepted and merged into the same note, never a second note
    by: Lead (tier 1)
  - from: revision-staged
    to: accepted
    'on': the revision is rejected; the note stays as it was
    by: Owner
  notes: A partial revision gives no acceptance authority and no credit for full reading.
