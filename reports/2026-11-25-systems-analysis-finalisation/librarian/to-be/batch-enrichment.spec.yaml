# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: batch-enrichment
use_case: UC1b
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-batch-enrichment-tobe.spec.yaml
- reports/2026-11-23-proposed-process-family/proposed-batch-enrichment.spec.yaml
title: Run the approved batch (proposed)
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/to-be/batch-enrichment.spec.yaml
problem:
  symptom: 'As-is: batches ran outside a session, checked the budget only before each item, drafted folders twice, and were
    repaired without an Oracle''s check.'
  root: Record what started the batch, reuse the receipts of work already done, reserve the budget before each dispatch, gate
    the result with the Oracle, and let the Doctor repair once.
lanes:
- Oracle
- Lead (tier 1)
- Doctor
- Clerk (tier 2)
- Scribe (tier 3)
- Core
nodes:
- id: s
  kind: start
  label: start
- id: activate
  kind: activity
  lane: Core
  step: 1
  label: records the batch's mandate (narrower than its parent), who owns it, the run's checkpoint and who commissioned and
    decided it
- id: dtrigger
  kind: decision
  lane: Core
  label: batch start authority source?
- id: useradmit
  kind: activity
  lane: Core
  label: takes the person's own Process approved selection
- id: t0admit
  kind: activity
  lane: Core
  label: validates tier 0's commission (or a scoped stage-only grant), recorded as decided by an agent
- id: bind
  kind: activity
  lane: Lead (tier 1)
  step: 2
  label: owns the delegated batch run, never wider than its parent
- id: admit
  kind: activity
  lane: Core
  step: 3
  label: validates the session's checkpoint, the frozen selection and the role routes
- id: dadmit
  kind: decision
  lane: Core
  label: admitted mixed work?
- id: nextitem
  kind: activity
  lane: Core
  step: 4
  label: picks next frozen source or folder item; isolates sibling faults
- id: controls
  kind: activity
  lane: Core
  step: 5
  label: checks cancellation and the writer lease, and reserves the item's budget before dispatching it
- id: dcontrols
  kind: decision
  lane: Core
  label: controls allow item?
- id: dkind
  kind: decision
  lane: Core
  label: item kind?
- id: source
  kind: ref
  lane: Core
  step: 6
  use_case: source-enrichment
  label: runs one source's enrichment under the shared commission and its budget
- id: fval
  kind: activity
  lane: Core
  label: 'validates the folder card: the survey digest, access and sensitivity flags'
- id: froute
  kind: activity
  lane: Core
  label: checks the folder drafting grant, reuses the intake receipt, and reserves the budget
- id: dfroute
  kind: decision
  lane: Core
  label: is folder drafting needed, and permitted?
- id: fscribe
  kind: activity
  lane: Scribe (tier 3)
  label: drafts inventory-grounded folder summary without reading documents
- id: freview
  kind: activity
  lane: Clerk (tier 2)
  label: reviews the folder summary's organisation and sensitivity
- id: fdata
  kind: activity
  lane: Core
  label: checks the folder's provenance arithmetic by script and writes its Data record
- id: ffail
  kind: activity
  lane: Core
  label: records failed folder stage without interrupting sibling items
- id: account
  kind: activity
  lane: Core
  step: 7
  label: updates the batch ledger with coverage, spend and the worklists
- id: dmore
  kind: decision
  lane: Core
  label: more frozen items?
- id: assess
  kind: activity
  lane: Clerk (tier 2)
  step: 8
  label: explains semantic partial gaps across items (Core account step owns literal counts)
- id: oracle
  kind: activity
  lane: Oracle
  step: 9
  label: verifies the batch ledger and its spend on a route distinct from the workers', and opens tickets on faults
- id: dverdict
  kind: decision
  lane: Oracle
  label: Oracle mixed-batch verdict?
- id: doctor
  kind: ref
  lane: Doctor
  use_case: doctor
  label: runs bounded accepted YAML repair without auto-rollback
- id: reentry
  kind: activity
  lane: Core
  label: checks the Doctor's single repair receipt
- id: fullhandoff
  kind: activity
  lane: Lead (tier 1)
  step: 10
  label: hands the verified batch and its separate pending worklists to the parent
- id: partialhandoff
  kind: activity
  lane: Lead (tier 1)
  label: returns the completed items beside the unmet tickets and partial items
- id: noworkhandoff
  kind: activity
  lane: Lead (tier 1)
  label: returns compatible reuse receipt with pending parent decisions preserved
- id: pausehandoff
  kind: activity
  lane: Lead (tier 1)
  label: returns the pause (cancelled, budget reached, or no Oracle route distinct from the workers' (never marked as independently
    reviewed)) as a ticket, with its state kept
- id: eschandoff
  kind: activity
  lane: Lead (tier 1)
  label: escalates critical fault with retained sibling receipts and logs
- id: e1
  kind: end
  outcome: success
  label: mixed batch obligations met; parent acceptance separate
- id: epartial
  kind: end
  outcome: partial
  label: mixed batch partial with explicit unmet items or tickets
- id: enowork
  kind: end
  outcome: reused
  label: no fresh batch work; compatible receipts reconciled
- id: epaused
  kind: end
  outcome: paused
  label: 'paused: cancelled, a reserved grant, the budget reached, or no distinct Oracle route'
- id: eescalated
  kind: end
  outcome: escalated
  label: critical or unrecoverable fault escalated to parent
edges:
- from: s
  to: activate
- from: activate
  to: dtrigger
- from: dtrigger
  to: bind
  guard: system triggered (parent ingest or schedule)
- from: dtrigger
  to: useradmit
  guard: user directed (Owner curate start)
  ext: 1a
- from: dtrigger
  to: t0admit
  guard: tier 0, under a commission or a scoped stage-only grant
  ext: 1b
- from: useradmit
  to: bind
- from: t0admit
  to: bind
- from: bind
  to: admit
- from: admit
  to: dadmit
- from: dadmit
  to: nextitem
  guard: nonempty frozen selection
- from: dadmit
  to: noworkhandoff
  guard: no fresh work
  ext: 3a
- from: dadmit
  to: pausehandoff
  guard: missing start authority
  ext: 3b
- from: nextitem
  to: controls
- from: controls
  to: dcontrols
- from: dcontrols
  to: dkind
  guard: the controls allow it and the budget is reserved
- from: dcontrols
  to: pausehandoff
  guard: cancelled, or the budget is reached
  ext: 5a
- from: dcontrols
  to: eschandoff
  guard: critical writer or integrity failure
  ext: 5b
- from: dkind
  to: source
  guard: source
- from: dkind
  to: fval
  guard: folder metadata card
  ext: 5c
- from: source
  to: account
  guard: success
- from: source
  to: account
  guard: partial
  ext: 6a
- from: source
  to: account
  guard: reused
  ext: 6b
- from: source
  to: pausehandoff
  guard: paused
  ext: 6c
- from: source
  to: eschandoff
  guard: escalated
  ext: 6d
- from: fval
  to: froute
- from: froute
  to: dfroute
- from: dfroute
  to: fscribe
  guard: drafting permitted
- from: dfroute
  to: fdata
  guard: scripted, or an intake receipt reused
- from: dfroute
  to: ffail
  guard: stale or invalid folder card
- from: fscribe
  to: freview
- from: freview
  to: fdata
- from: fdata
  to: account
- from: ffail
  to: account
- from: account
  to: dmore
- from: dmore
  to: assess
  guard: frozen list done
- from: dmore
  to: nextitem
  guard: another item
  ext: 7a
- from: assess
  to: oracle
- from: oracle
  to: dverdict
- from: dverdict
  to: fullhandoff
  guard: satisfied (distinct Oracle route)
- from: dverdict
  to: doctor
  guard: mapped repairable shortfall
  ext: 9a
- from: dverdict
  to: partialhandoff
  guard: truthful partial return
  ext: 9b
- from: dverdict
  to: eschandoff
  guard: critical integrity failure
  ext: 9c
- from: dverdict
  to: pausehandoff
  guard: no Oracle route distinct from the workers' (never marked as independently reviewed)
  ext: 9d
- from: doctor
  to: reentry
  guard: resolved
- from: reentry
  to: assess
- from: doctor
  to: partialhandoff
  guard: declined
- from: doctor
  to: eschandoff
  guard: escalated
- from: fullhandoff
  to: e1
- from: partialhandoff
  to: epartial
- from: noworkhandoff
  to: enowork
- from: pausehandoff
  to: epaused
- from: eschandoff
  to: eescalated
