# Plain-language pass by tools/s4_plain_language.py (S4, 2026-11-25); structure unchanged.
diagram: source-intake
use_case: UC1.2
status: PROPOSED_UNACCEPTED
kind: activity
title: Capture, title and stage each source (proposed)
lanes:
- Clerk (tier 2)
- Core
nodes:
- id: s
  kind: start
  label: start
- id: capture
  kind: activity
  lane: Core
  label: captures immutable evidence and literal header or DOI metadata, quarantining failed siblings
  step: 1
- id: dcap
  kind: decision
  lane: Core
  label: do the capture and the queue reconcile?
- id: describe
  kind: activity
  lane: Clerk (tier 2)
  label: proposes a readable title when the header is a slug or file name, a neutral description, its fields (Unknown where
    unsupported) and topics
  step: 2
- id: stage
  kind: activity
  lane: Core
  label: validates and stages the title, the record and its unknowns; asks for topics if it would be Unfiled
  step: 3
- id: e_success
  kind: end
  outcome: success
  label: the sources are staged with proposed titles
- id: e_reused
  kind: end
  outcome: reused
  label: duplicates only
- id: e_paused
  kind: end
  outcome: paused
  label: every target quarantined
edges:
- from: s
  to: capture
- from: capture
  to: dcap
- from: dcap
  to: describe
  guard: usable Sources captured
- from: dcap
  to: e_reused
  guard: duplicates only
  ext: 2a
- from: dcap
  to: e_paused
  guard: every target quarantined or unreachable
  ext: 2b
- from: describe
  to: stage
- from: stage
  to: e_success
