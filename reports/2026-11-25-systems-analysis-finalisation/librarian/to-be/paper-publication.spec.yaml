# Geo-Grapher woven in by tools/s9_weave.py (2026-11-26).
diagram: paper-publication
use_case: UC1c.3
status: PROPOSED_UNACCEPTED
kind: activity
title: Publish a read paper to Geo-Grapher (proposed)
lanes:
- Core
- Geo-Grapher
nodes:
- id: s
  kind: start
  label: start
- id: dpub
  kind: decision
  lane: Core
  label: eligible for Geo paper publication?
- id: publish
  kind: ref
  lane: Geo-Grapher
  label: publishes the converted paper in Geo-Grapher as one checked insert, and returns its receipt and stored link (UC-G2)
  use_case: geo-grapher/to-be/paper-import
  step: 1
- id: pubreceipt
  kind: activity
  lane: Core
  label: requires claims for a multi-page PDF, and checks for bridges to propose
  step: 2
- id: dpubok
  kind: decision
  lane: Core
  label: publish receipt valid and non-empty?
- id: e_success
  kind: end
  outcome: success
  label: published, with a non-empty claim receipt
- id: e_not_applicable
  kind: end
  outcome: not applicable
  label: not a PDF, or no full conversion
- id: e_gap
  kind: end
  outcome: gap
  label: Geo-Grapher disabled, a refusal, a partial publication (its Geo-Grapher ticket kept), or an empty paper graph
edges:
- from: s
  to: dpub
- from: dpub
  to: publish
  guard: 'fully converted: into its folder''s group, or the library''s own papers group when it has none'
- from: dpub
  to: e_not_applicable
  guard: non-PDF or no conversion
  ext: 1a
- from: dpub
  to: e_gap
  guard: Geo-Grapher disabled for this library
  ext: 1b
- from: pubreceipt
  to: dpubok
- from: dpubok
  to: e_success
  guard: valid, with claims, and bridges checked
- from: dpubok
  to: e_gap
  guard: an empty paper graph, or a late refusal
  ext: 2a
- from: publish
  to: pubreceipt
  guard: success
- from: publish
  to: e_gap
  guard: partial
  ext: 1c
- from: publish
  to: e_gap
  guard: refused
  ext: 1d
