# Handoff review by tools/s6_handoff_fixes.py (2026-11-26).
diagram: doctor
use_case: UC-D
status: PROPOSED_UNACCEPTED
supersedes:
- reports/2026-11-24-librarian-reconstruction-and-offering/diagrams/librarian-doctor-tobe.spec.yaml
- reports/2026-11-20-workflow-map/examples/ingestion/doctor.spec.yaml
title: Repair a failure through a ticket (proposed)
problem:
  symptom: The earlier doctor rolled compensation back automatically, used a helper role, had no activation or ticket routing,
    and blocked unattended runs on the Owner.
  root: A structured ticket (extension, flags, owner, repair history), only accepted remedies within a computed blast radius
    and the Doctor's limits, routing that never blocks the caller, compensation shown not run, and the Oracle's recheck.
lanes:
- Owner
- Oracle
- Lead (tier 1)
- Doctor
- Clerk (tier 2)
- Core
nodes:
- id: s
  kind: start
  label: start
- id: intake
  kind: activity
  lane: Core
  label: 'records the ticket: the extension, tiered flags, evidence hash, accountable actor, repair history, the Oracle it
    needs, and the mandate'
  step: 1
- id: dtrigger
  kind: decision
  lane: Core
  label: who raised the ticket?
- id: userdoc
  kind: activity
  lane: Core
  label: takes the Owner's own repair request from the Web UI
- id: t0doc
  kind: activity
  lane: Core
  label: takes tier 0's commission or an external project's scoped grant; in-scope remedies run, and nothing widens it
- id: dremedy
  kind: decision
  lane: Core
  label: accepted YAML remedy matches?
- id: scout
  kind: activity
  lane: Clerk (tier 2)
  label: scouts the unmapped defect read-only and attaches its findings to the ticket
- id: draftprop
  kind: activity
  lane: Doctor
  label: drafts a remedy for the unmapped case on the Lead's ticket; it never installs or runs it
- id: blast
  kind: activity
  lane: Core
  label: 'computes the blast radius against the parent''s mandate: at most 3 recovery steps and 2 paid calls'
  step: 2
- id: dgrant
  kind: decision
  lane: Core
  label: within the parent's mandate and the Doctor's limits?
- id: downeravail
  kind: decision
  lane: Core
  label: interactive Owner directly present?
- id: askowner
  kind: activity
  lane: Lead (tier 1)
  label: asks the Owner for the reserved scope, with the exact blast radius
- id: downer
  kind: decision
  lane: Owner
  label: Owner grants expanded scope?
- id: runremedy
  kind: activity
  lane: Doctor
  label: runs the accepted remedy in an isolated context
  step: 3
- id: checkrepair
  kind: activity
  lane: Core
  label: reruns the deterministic checks, records the changed hashes on the ticket, and checks the repair ran apart from the
    workers
  step: 4
- id: drepaired
  kind: decision
  lane: Core
  label: deterministic checks passed?
- id: showcomp
  kind: activity
  lane: Core
  label: attaches the compensation plan and the failed attempt to the ticket; it is shown, never run automatically
- id: dcomp
  kind: decision
  lane: Lead (tier 1)
  label: noncritical hold vs critical escalation?
- id: oracle
  kind: activity
  lane: Oracle
  label: confirms the cleared ticket on a route distinct from the workers', switching reviewer on a collision
  step: 5
- id: doracle
  kind: decision
  lane: Oracle
  label: Oracle confirms shortfall resolved?
- id: closeresolved
  kind: activity
  lane: Core
  label: marks the ticket resolved, with its repair history, the Oracle's pass and the notice to the caller
  step: 6
- id: haltdecline
  kind: activity
  lane: Lead (tier 1)
  label: keeps the ticket open, declined or deferred, assigned to the Owner on the agenda with its evidence, the compensation
    and a review date
- id: haltescalate
  kind: activity
  lane: Lead (tier 1)
  label: routes the critical ticket at once, with its flags, hashes and the compensation shown
- id: e1
  kind: end
  outcome: resolved
  label: accepted remedy verified by Oracle; ticket closed
- id: e2
  kind: end
  outcome: declined
  label: unmapped, deferred, or declined without auto-rollback; ticket retained
- id: e3
  kind: end
  outcome: escalated
  label: bounds exhausted or critical fault; escalated with displayed compensation
edges:
- from: s
  to: intake
- from: intake
  to: dtrigger
- from: dtrigger
  to: dremedy
  guard: system triggered
- from: dtrigger
  to: userdoc
  guard: user directed
  ext: 2a
- from: dtrigger
  to: t0doc
  guard: tier 0 directed
  ext: 2b
- from: userdoc
  to: dremedy
- from: t0doc
  to: dremedy
- from: dremedy
  to: blast
  guard: accepted YAML remedy matched
- from: dremedy
  to: scout
  guard: unmapped or proposed-only
  ext: 2c
- from: scout
  to: draftprop
- from: draftprop
  to: haltdecline
- from: blast
  to: dgrant
- from: dgrant
  to: runremedy
  guard: within the blast radius and the Doctor's limits
- from: dgrant
  to: downeravail
  guard: wider than narrowed mandate (never widens autonomously)
  ext: 3a
- from: downeravail
  to: askowner
  guard: user directed
- from: downeravail
  to: haltdecline
  guard: tier 0 or system triggered (do not block)
- from: askowner
  to: downer
- from: downer
  to: runremedy
  guard: granted
- from: downer
  to: haltdecline
  guard: declined
- from: downer
  to: haltescalate
  guard: critical
- from: dgrant
  to: haltescalate
  guard: a critical security, data-loss or boundary violation (at once)
  ext: 3b
- from: runremedy
  to: checkrepair
- from: checkrepair
  to: drepaired
- from: drepaired
  to: oracle
  guard: checks passed
- from: drepaired
  to: showcomp
  guard: the checks failed, or the step or call limit was reached
  ext: 5a
- from: showcomp
  to: dcomp
- from: dcomp
  to: haltdecline
  guard: hold with shown compensation
- from: dcomp
  to: haltescalate
  guard: escalate unresolved fault
- from: oracle
  to: doracle
- from: doracle
  to: closeresolved
  guard: resolved (distinct Oracle route pass)
- from: doracle
  to: showcomp
  guard: the recheck failed, or no distinct Oracle route (never marked resolved)
  ext: 6a
- from: closeresolved
  to: e1
- from: haltdecline
  to: e2
- from: haltescalate
  to: e3
