# Current-state upstream activation map at commit d9435e1 (implemented/verified UI, folder review, workflow, MCP, Broker & Intake/Staging paths).
# Folder survey/review/Geo apply is separate from Source intake; the only bridge is POST /api/folders/sources -> ingest(defer=true) -> queue -> intake.
# deep-read-staged is a plain workflow (staging_list -> each deep_read), NOT a call of source-enrichment-current; it ends finished/paused/failed.
# Batch work calls batch-enrichment-current via ref; historical DataManagement ingestion.canvas is untouched.
diagram: librarian-current-activation
superseded_by: reports/2026-11-25-systems-analysis-finalisation/librarian/as-is/activation.spec.yaml
kind: activity
status: IMPLEMENTED_VERIFIED
title: "Current Activation Paths: Present-Day UI, Folders, Workflows, MCP & Staging (d9435e1)"
problem:
  symptom: "MCP agents hit contribute caps, 0 folder MCP tools, curate process_approved refusals, 150s Ask waits, F-09 form wipes, and dropped workflow results (app.js:8472)."
  root: "Document verified d9435e1 UI, separate Folder review/Geo apply, the /api/folders/sources queue bridge, the deep-read-staged workflow, MCP/Broker and batch paths without retrofitting the historical trace."
lanes:
  - Tier 0 agent (MCP / CLI-API)
  - Geo-Grapher
  - Core
  - Librarian Web UI
  - Human user
  - In-app Lead / Model worker

nodes:
  - {id: s, kind: start, label: start}
  - {id: hist_note, kind: note, lane: Core, label: "d9435e1 current-state map; separates Folder review/Geo apply from Source intake, connects them only via /api/folders/sources, and preserves historical ingestion.canvas."}
  - {id: initiate, kind: activity, lane: Human user, step: 1, label: "initiates via Web UI (Add source, Folders, Chat, or paperclip workflow), instructs Tier 0 (Context 1), or runs ext build (Context 2)"}
  - {id: dcontext, kind: decision, lane: Core, label: "which present-day activation surface enters Core?"}
  - {id: ui_source_intake, kind: activity, lane: Librarian Web UI, step: 2, label: "submits Staging -> Sources -> Add source via person_call(ingest, defer=false) at curate tier (bypasses Broker)"}
  - {id: c1_call, kind: activity, lane: Tier 0 agent (MCP / CLI-API), label: "calls MCP capped at contribute (0 folder MCP tools; process_approved refused) or declared actor=agent /api/tool CLI"}
  - {id: dc1_broker, kind: decision, lane: Core, label: "Context 1 surface, tier & Broker Ask check?"}
  - {id: c1_refusal, kind: activity, lane: Tier 0 agent (MCP / CLI-API), label: "stops at TIER_REFUSED / 0 MCP folder tools / Plan deny / 150s PERMISSION_UNANSWERED; reports manual UI step"}
  - {id: c2_call, kind: activity, lane: Tier 0 agent (MCP / CLI-API), label: "calls search/read_source_section, delegate/dispatch_plan, queue_source, ingest, or record_application"}
  - {id: dc2_gate, kind: decision, lane: Core, label: "Context 2 MCP tier & S1-S6b third-party check?"}
  - {id: c2_helpers, kind: activity, lane: In-app Lead / Model worker, label: "runs contribute read-only DeepInfra delegate / dispatch_plan DAGs with zero Ask prompt"}
  - {id: dc2_outcome, kind: decision, lane: Core, label: "Context 2 source readiness & Applications/ path?"}
  - {id: c2_record_app, kind: activity, lane: Core, label: "writes append-only Applications/ note (attested_by=agent, [[note]]) + sidecar & auto-enqueues unresolved_sources"}
  - {id: c2_deliver_reuse, kind: activity, lane: Tier 0 agent (MCP / CLI-API), label: "delivers ext-project result + Applications/ link (no snapshot hashes/locators/verification schema)"}
  - {id: c2_queue_only, kind: activity, lane: Core, label: "refuses empty sources_used (TypeError) or leaves queued leads for later intake without blocking ext task"}
  - {id: c2_deliver_partial, kind: activity, lane: Tier 0 agent (MCP / CLI-API), label: "returns external workaround/gap notice & queued unresolved lead IDs to user"}
  - {id: c2_refusal, kind: activity, lane: Tier 0 agent (MCP / CLI-API), label: "stops on consult delegate TIER_REFUSED, raw 3rd-party THIRD_PARTY_ROUTE_REQUIRED, or 150s Ask timeout"}
  - {id: ui_folder_survey, kind: activity, lane: Librarian Web UI, label: "POST /api/folders/survey walks directory metadata only (files unread, credential paths refused) & stages kind=folder cards"}
  - {id: folder_stage_cards, kind: activity, lane: Core, label: "FolderReview.survey records fingerprints, suggested purpose & stratum graph on folder cards (0 Source items created)"}
  - {id: dfolder_action, kind: decision, lane: Core, label: "folder action on /api/folders/*?"}
  - {id: folder_draft_check, kind: decision, lane: Core, label: "POST /api/folders/draft: production_drafting & provenance arithmetic ok?"}
  - {id: folder_clerk_draft, kind: activity, lane: In-app Lead / Model worker, label: "drafts 1-sentence folder brief & sensitivity from file counts/bytes only; stages draft on folder card"}
  - {id: folder_draft_hold, kind: activity, lane: Core, label: "retains folder card in Folders awaiting person Accept folder decision (or records FOLDER_DRAFT_DISABLED / provenance refusal)"}
  - {id: folder_batch_approve, kind: activity, lane: Core, label: "POST /api/folders/approve-batch (person=True) marks 1-100 non-sensitive folder cards approved (not accepted)"}
  - {id: dfolder_batch_go, kind: decision, lane: Core, label: "person submits Process approved in Staging for approved folder cards?"}
  - {id: folder_accept_prep, kind: activity, lane: Core, label: "accept (person=True) or accept-policy (promotion.mode=agent): checks all-groups FOLDER_STALE & writes content-roots.json barrier"}
  - {id: dfolder_prep, kind: decision, lane: Core, label: "folder validation, policy & group check?"}
  - {id: geo_folder_apply, kind: activity, lane: Geo-Grapher, label: "runs apply-folder-review CLI across all accepted non-excluded library groups & writes graph snapshots"}
  - {id: dfolder_post, kind: decision, lane: Core, label: "Geo apply result & accepted folder purpose?"}
  - {id: ui_folder_done, kind: activity, lane: Librarian Web UI, label: "shows Accepted folder & Geo graph status in Folders (own-code/data/logs/exclude never become Sources)"}
  - {id: folder_queue_sources, kind: activity, lane: Core, label: "separate click POST /api/folders/sources: folder_sources.queue calls ingest(defer=true) per document (UI button: third-party/research-docs; API also own-docs); writes folder-sources.json, status=queued"}
  - {id: dqueue_drain, kind: decision, lane: Core, label: "queued intake refs drained via intake_run / run-queue?"}
  - {id: chat_lead, kind: activity, lane: In-app Lead / Model worker, label: "handles UI Chat+Attach; calls tools & asks person tool-by-tool in Modes: Ask (600s wait; no sprint envelope)"}
  - {id: dchat_broker, kind: decision, lane: Core, label: "Chat tool target & Broker Ask/Plan check?"}
  - {id: ui_wf_start, kind: activity, lane: Core, label: "App.start_action starts paperclip workflow at tier=contribute with workflow_grant (read_access exempts deep_read only)"}
  - {id: dwf_route, kind: decision, lane: Core, label: "which paperclip workflow & grant check?"}
  - {id: wf_deep_read, kind: activity, lane: In-app Lead / Model worker, label: "deep-read-staged.yaml: staging_list(source, staged, limit=10) -> each deep_read(max_chunks=12, on_error: continue) via clerk_endpoint; item status unchanged"}
  - {id: dwf_outcome, kind: decision, lane: Core, label: "workflows.Runner status on action_done?"}
  - {id: ui_drop_result, kind: activity, lane: Librarian Web UI, label: "app.js:8472 discards action_done.result (_result: {read, failed, errors}) & hides chip; reloads Staging where items stay staged"}
  - {id: dwf_followup, kind: decision, lane: Core, label: "person submits Staging decision on still-staged items?"}
  - {id: wf_paused_chip, kind: activity, lane: Librarian Web UI, label: "app.js:8472 drops result; renders static paused chip with no UI route-picker, resume, or dismiss control"}
  - {id: wf_refused, kind: activity, lane: Core, label: "App._run_action catches Refusal/DefinitionError (TIER_REFUSED, PERSON_CONFIRMS, or non-deep_read THIRD_PARTY_ROUTE_REQUIRED) -> status=failed"}
  - {id: capture_source, kind: activity, lane: Core, step: 3, label: "intake.ingest fetches immutable Bronze .evidence/, checks extraction quality & duplicates, and restores _framing on queued refs"}
  - {id: dcap_curr, kind: decision, lane: Core, label: "Source capture outcome?"}
  - {id: reuse_curr, kind: activity, lane: Core, label: "links already_held note or brief screened_out record without duplicate staging"}
  - {id: quar_curr, kind: activity, lane: Core, label: "quarantines failed ref & settles queue entry for retry"}
  - {id: clerk_draft, kind: activity, lane: In-app Lead / Model worker, step: 4, label: "intake.describe drafts neutral opening summary via clerk_endpoint (slug/filename titles & Unfiled if <=1 topic remain)"}
  - {id: stage_source, kind: activity, lane: Core, step: 5, label: "writes kind=source (status=staged) in StagingStore (distinct from kind=folder cards)"}
  - {id: dgate1_auth, kind: decision, lane: Core, label: "Source Gate 1 decision & curate process_approved start authority?"}
  - {id: gate1_ui, kind: activity, lane: Human user, step: 6, label: "reviews Staging -> Sources (Which sources hides processing/accepted); approves Gate 1 & clicks Process approved"}
  - {id: accept_captured, kind: activity, lane: Core, label: "promotes captured/partial Source note with explicit coverage & not_examined list"}
  - {id: dmanual_handover, kind: decision, lane: Human user, label: "human takes over Gate 1 / Process approved in Web UI?"}
  - {id: start_batch, kind: activity, lane: Core, step: 7, label: "validates curate person_call, single _LIVE lock & freezes approved Sources (+ any approved Folder cards)"}
  - {id: batch_ref, kind: ref, lane: Core, step: 8, use_case: batch-enrichment-current, label: "dispatches frozen mixed batch via batch-enrichment-current (calls source-enrichment-current for Sources; FOLDER_STAGES for folders)"}
  - {id: dpartial_accept, kind: decision, lane: Core, label: "partial/failed item disposition & promotion mode?"}
  - {id: gate2_ui, kind: activity, lane: Human user, step: 9, label: "reviews enriched Source summary (F-09 conflict reload wipes edits) & clicks Accept; Folder accept & Lenses stay separate"}
  - {id: dgate2_curr, kind: decision, lane: Core, label: "Source Gate 2 decision & PromotionGuard CAS check?"}
  - {id: promote_curr, kind: activity, lane: Core, step: 10, label: "commits Sources/ note via PromotionGuard (200-file CAS), IndexGateway FTS, DA-3 handoff & post-write vectors"}
  - {id: dfind_curr, kind: decision, lane: Core, label: "post-promotion catalogued & vector status?"}
  - {id: ui_done, kind: activity, lane: Librarian Web UI, step: 11, label: "shows ok banner & Search/Staging updates (manual Rewrite indexes if needed; no Oracle/Doctor runtime)"}
  - {id: user_done, kind: activity, lane: Human user, step: 12, label: "receives catalogued Source note in Search/Vault; Folders/Lenses/Topics remain separate"}
  - {id: ui_hold_notice, kind: activity, lane: Librarian Web UI, label: "surfaces Ask prompt, refusal, FOLDER_STALE/policy hold, F-09 conflict, or waiting/queued Staging state"}
  - {id: user_paused, kind: activity, lane: Human user, label: "receives refusal, Ask timeout, paused workflow chip, or manual Staging/Folders handover requirement"}
  - {id: ui_partial_notice, kind: activity, lane: Librarian Web UI, label: "updates Staging/Search with partial/captured/warning state or finished workflow without result drawer"}
  - {id: user_partial, kind: activity, lane: Human user, label: "receives partial/captured/queued/embedding_warnings result or unseen finished workflow state"}
  - {id: user_reused, kind: activity, lane: Human user, label: "receives reused note, Applications/ precedent, or indexed-whole non-Source folder confirmation"}
  - {id: ui_fail_notice, kind: activity, lane: Librarian Web UI, label: "surfaces error banner, failed Geo folder apply, or failed workflow chip (result.error dropped)"}
  - {id: user_esc, kind: activity, lane: Human user, label: "receives failure alert & retained barrier/staging state"}
  - {id: e1, kind: end, outcome: success, label: "Source catalogued & findable via current UI/batch path; Folder/Lens/Topic decisions separate"}
  - {id: epartial, kind: end, outcome: partial, label: "completed with partial coverage, queued leads, or discarded finished workflow output (items still staged)"}
  - {id: ereused, kind: end, outcome: reused, label: "reused existing note/precedent or applied non-Source folder graph without Source intake"}
  - {id: epaused, kind: end, outcome: paused, label: "paused on Ask timeout, TIER_REFUSED, FOLDER_STALE/policy hold, queued refs, or paused workflow chip"}
  - {id: eescalated, kind: end, outcome: escalated, label: "failed workflow, Geo apply, or uncaught batch/write error surfaced with retained state"}

