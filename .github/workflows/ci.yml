name: Core CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Core and tests
        run: python -m pip install -e ".[dev]"
      - name: Run L0/Core suite
        run: python -m pytest
  wheel-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build Core wheel
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --outdir wheel-out .
      - name: Smoke clean installed wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath wheel-out -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one Core wheel, found $($wheels.Count)."
          }
          ./scripts/smoke-installed-wheel.ps1 `
            -Python python `
            -Wheel $wheels[0].FullName `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-wheel-smoke-${{ matrix.python }}")
  adapters:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build browser UI from lockfile
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build Obsidian adapter from lockfile
        working-directory: obsidian
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build packaged adapter artifacts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]" build
          ./scripts/build-release.ps1 -Python python -OutDir adapter-release-out -SkipTests -SkipUi
      - name: Smoke packaged Browser and Cowork together
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath adapter-release-out/core -Filter *.whl -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one Core wheel." }
          ./scripts/smoke-packaged-adapters.ps1 `
            -Python python `
            -Wheel $wheel[0].FullName `
            -CoworkZip (Resolve-Path adapter-release-out/cowork/librarian-cowork.zip).Path `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-packaged-adapters")
