name: Core CI

on:
  push:
  pull_request:

# MF-043 (build and release hardening). Rules, checked by tests/test_ci_workflows.py:
# - the token only reads;
# - every action is pinned to a commit;
# - runner, Python and Node are exact;
# - every Python package installs from a hash lock;
# - no `${{ }}` expression is pasted into a script: values reach scripts as
#   environment variables;
# - test evidence is kept, whether the run passes or not.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.10", "3.13.17"]
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Core and tests from the hash lock
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Run L0/Core suite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-evidence | Out-Null
          python -m pip freeze --all | Out-File -Encoding utf8 "test-evidence/pip-freeze-py$env:PYTHON_VERSION.txt"
          python -m pytest --junitxml "test-evidence/junit-py$env:PYTHON_VERSION.xml"
      - name: Keep the test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-evidence-core-${{ matrix.python }}
          path: test-evidence
          retention-days: 90
          if-no-files-found: warn
  wheel-smoke:
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11.9", "3.12.10", "3.13.17"]
    env:
      PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build Core wheel from the locked build tools
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
          python -m build --no-isolation --wheel --outdir wheel-out .
      - name: Smoke clean installed wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath wheel-out -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one Core wheel, found $($wheels.Count)."
          }
          ./scripts/smoke-installed-wheel.ps1 `
            -Python python `
            -Wheel $wheels[0].FullName `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-wheel-smoke-$env:PYTHON_VERSION")
  adapters:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.4"
      - name: Build browser UI from lockfile
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build Obsidian adapter from lockfile
        working-directory: obsidian
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Build packaged adapter artifacts
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          ./scripts/build-release.ps1 -Python python -OutDir adapter-release-out -SkipTests -SkipUi -NoBuildIsolation
      - name: Smoke packaged Browser and Cowork together
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath adapter-release-out/core -Filter *.whl -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one Core wheel." }
          ./scripts/smoke-packaged-adapters.ps1 `
            -Python python `
            -Wheel $wheel[0].FullName `
            -CoworkZip (Resolve-Path adapter-release-out/cowork/librarian-cowork.zip).Path `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-packaged-adapters")
