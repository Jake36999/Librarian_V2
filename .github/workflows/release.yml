name: Release bundle

on:
  workflow_dispatch:
    inputs:
      stable_release:
        description: Build the protected stable bundle using reviewed release inputs and signing secrets
        required: true
        type: boolean
        default: false
      release_leads_path:
        description: Repository-relative reviewed stable release-leads.json path
        required: false
        type: string
        default: release-inputs/release-leads.json
      requirements_lock_path:
        description: Repository-relative pip-compile --generate-hashes lock path
        required: false
        type: string
        default: release-inputs/requirements.release.lock
      wheelhouse_path:
        description: Repository-relative offline wheelhouse path
        required: false
        type: string
        default: release-inputs/wheelhouse
  push:
    tags: ["v*"]

# MF-043 (see ci.yml for the rules, which tests/test_ci_workflows.py checks). On top
# of those, only the jobs that attest their artifacts may mint an OIDC token and
# write attestations. Dispatch inputs reach scripts as environment variables and
# are checked as repository-relative paths before anything uses them.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
      - name: Install release build tools from the hash lock
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Build all release artifacts
        shell: pwsh
        run: ./scripts/build-release.ps1 -Python python -OutDir release-out -NoBuildIsolation
      - name: Smoke candidate Core wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath release-out/core -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one candidate Core wheel, found $($wheels.Count)."
          }
          ./scripts/smoke-installed-wheel.ps1 `
            -Python python `
            -Wheel $wheels[0].FullName `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-candidate-wheel-smoke")
      - name: Smoke candidate packaged adapters
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath release-out/core -Filter *.whl -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one candidate Core wheel." }
          ./scripts/smoke-packaged-adapters.ps1 `
            -Python python `
            -Wheel $wheel[0].FullName `
            -CoworkZip (Resolve-Path release-out/cowork/librarian-cowork.zip).Path `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-candidate-packaged-adapters")
      - name: Software bill of materials
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath release-out/core -Filter *.whl -File)[0]
          python scripts/make_sbom.py --wheel $wheel.FullName --out release-out/sbom.cdx.json `
            --build-lock requirements-build.txt --npm-lock ui/package-lock.json --npm-lock obsidian/package-lock.json
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-out/core/*.whl
            release-out/obsidian/*.zip
            release-out/cowork/*.zip
            release-out/host/*.ps1
            release-out/installer/*.ps1
            release-out/release-manifest.json
            release-out/sbom.cdx.json
      - name: Verify the attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $subjects = @(Get-ChildItem -LiteralPath release-out/core, release-out/cowork, release-out/obsidian -File) +
            @(Get-Item -LiteralPath release-out/release-manifest.json, release-out/sbom.cdx.json)
          foreach ($subject in $subjects) {
            gh attestation verify $subject.FullName --repo $env:REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "No valid provenance for $($subject.Name)." }
          }
      - name: Upload non-installable candidate bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: librarian-candidate-${{ github.ref_name }}
          path: release-out
          retention-days: 90

  stable:
    # A tag produces a reviewable candidate.  Stable publication is an
    # explicitly approved dispatch with actual L3 evidence, a hash lock,
    # wheelhouse, and a protected signing certificate; it cannot accidentally
    # treat checked-in candidate data as a production release.
    if: github.event_name == 'workflow_dispatch' && inputs.stable_release
    needs: candidate
    runs-on: windows-2025
    timeout-minutes: 60
    environment: stable-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_LEADS: ${{ inputs.release_leads_path }}
      REQUIREMENTS_LOCK: ${{ inputs.requirements_lock_path }}
      WHEELHOUSE: ${{ inputs.wheelhouse_path }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
      - name: Check the release inputs are repository paths
        shell: pwsh
        run: |
          $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
          foreach ($name in "RELEASE_LEADS", "REQUIREMENTS_LOCK", "WHEELHOUSE") {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]*$' -or $value -match '(^|/)\.\.(/|$)') {
              throw "$name must be a repository-relative path of letters, digits and . _ - /: '$value'"
            }
            $full = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE $value))
            if (-not $full.StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) { throw "$name leaves the repository." }
            if (-not (Test-Path -LiteralPath $full)) { throw "$name does not exist: $value" }
          }
      - name: Install release build tools from the hash lock
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt
          python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
      - name: Build evidence-backed stable bundle
        shell: pwsh
        run: >
          ./scripts/build-release.ps1 -Python python -OutDir release-out -Stable -NoBuildIsolation
          -ReleaseLeads $env:RELEASE_LEADS
          -RequirementsLock $env:REQUIREMENTS_LOCK
          -Wheelhouse $env:WHEELHOUSE
      - name: Smoke stable Core wheel before signing
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath release-out/core -Filter *.whl -File)
          if ($wheels.Count -ne 1) {
            throw "Expected exactly one stable Core wheel, found $($wheels.Count)."
          }
          ./scripts/smoke-installed-wheel.ps1 `
            -Python python `
            -Wheel $wheels[0].FullName `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-stable-wheel-smoke") `
            -Wheelhouse (Resolve-Path -LiteralPath release-out/wheelhouse).Path
      - name: Smoke stable packaged adapters
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath release-out/core -Filter *.whl -File)
          if ($wheel.Count -ne 1) { throw "Expected exactly one stable Core wheel." }
          ./scripts/smoke-packaged-adapters.ps1 `
            -Python python `
            -Wheel $wheel[0].FullName `
            -CoworkZip (Resolve-Path release-out/cowork/librarian-cowork.zip).Path `
            -WorkRoot (Join-Path $env:RUNNER_TEMP "librarian-stable-packaged-adapters") `
            -Wheelhouse (Resolve-Path -LiteralPath release-out/wheelhouse).Path
      - name: Import protected signing certificate
        id: signing
        shell: pwsh
        env:
          LIBRARIAN_RELEASE_PFX_BASE64: ${{ secrets.LIBRARIAN_RELEASE_PFX_BASE64 }}
          LIBRARIAN_RELEASE_PFX_PASSWORD: ${{ secrets.LIBRARIAN_RELEASE_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LIBRARIAN_RELEASE_PFX_BASE64)) {
            throw "The protected stable-release PFX secret is required."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "librarian-release.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:LIBRARIAN_RELEASE_PFX_BASE64))
          try {
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My `
              -Password (ConvertTo-SecureString $env:LIBRARIAN_RELEASE_PFX_PASSWORD -AsPlainText -Force)
            if (-not $certificate -or -not $certificate.HasPrivateKey) { throw "The release certificate has no private key." }
            "thumbprint=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Sign and verify stable bundle
        shell: pwsh
        env:
          CERTIFICATE_THUMBPRINT: ${{ steps.signing.outputs.thumbprint }}
        run: |
          ./scripts/sign-release.ps1 -ReleaseRoot release-out -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT
          ./scripts/verify-release.ps1 -ReleaseRoot release-out
      - name: Software bill of materials
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath release-out/core -Filter *.whl -File)[0]
          python scripts/make_sbom.py --wheel $wheel.FullName --out release-out/sbom.cdx.json `
            --lock release-out/requirements.release.lock --build-lock requirements-build.txt `
            --npm-lock ui/package-lock.json --npm-lock obsidian/package-lock.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-out/core/*.whl
            release-out/obsidian/*.zip
            release-out/cowork/*.zip
            release-out/host/*.ps1
            release-out/installer/*.ps1
            release-out/release-manifest.json
            release-out/sbom.cdx.json
      - name: Verify the attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $subjects = @(Get-ChildItem -LiteralPath release-out/core, release-out/cowork, release-out/obsidian -File) +
            @(Get-Item -LiteralPath release-out/release-manifest.json, release-out/sbom.cdx.json)
          foreach ($subject in $subjects) {
            gh attestation verify $subject.FullName --repo $env:REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "No valid provenance for $($subject.Name)." }
          }
      - name: Upload verified stable bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: librarian-release-${{ github.ref_name }}
          path: release-out
          retention-days: 90
